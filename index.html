<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>My Gems · Jewel Atelier V3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:root{--bg:#fffafc;--panel:#fff;--soft:#f7eef5;--soft2:#fbf7fa;--line:#ecdde8;--rose:#cf8db3;--rose2:#b96e98;--text:#6a5765;--muted:#9f90a0;--shadow:0 8px 28px rgba(185,110,152,.12)}
html,body{margin:0;height:100%;background:linear-gradient(180deg,#fffdfd 0%,#fff7fb 100%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(255,226,240,.45),transparent 28%),radial-gradient(circle at 80% 0%,rgba(227,245,255,.38),transparent 26%),radial-gradient(circle at 50% 90%,rgba(242,235,255,.34),transparent 26%);pointer-events:none;z-index:-1}
button,input{font:inherit}
#home{position:fixed;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 34px}
.hero{text-align:center;padding:2px 0 12px}
.hero h1{font-family:'Snell Roundhand','Apple Chancery',cursive;font-size:42px;line-height:1;margin:4px 0 4px;color:var(--rose2);font-weight:500;letter-spacing:.5px}
.hero .sub{font-size:12px;letter-spacing:3px;color:#b797ae;text-transform:uppercase}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0 6px}
.tab{flex:none;padding:10px 15px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid var(--line);box-shadow:0 3px 10px rgba(185,110,152,.06);font-size:14px;white-space:nowrap}
.tab.on{background:linear-gradient(180deg,#e9b0cb 0%, #cf8db3 100%);color:#fff;border-color:#d59abd}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;margin-top:10px}
.card{aspect-ratio:1;border-radius:22px;background:rgba(255,255,255,.9);box-shadow:var(--shadow);overflow:hidden;position:relative;border:1px solid rgba(236,221,232,.9)}
.card canvas,.card img{width:100%;height:100%;display:block}
.card .bd{position:absolute;left:7px;right:7px;bottom:8px;font-size:11px;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);border:1px solid rgba(236,221,232,.95);color:#8d7484;border-radius:10px;padding:3px 6px;text-align:center;line-height:1.15}
.card .pct{position:absolute;top:8px;right:8px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.86);color:#8e7084;font-size:11px;border:1px solid var(--line)}
#game{position:fixed;inset:0;display:none;flex-direction:column;background:linear-gradient(180deg,#fffdfd 0%,#fff8fb 100%)}
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
#top button,.btn{border:1px solid var(--line);background:rgba(255,255,255,.84);backdrop-filter:blur(10px);border-radius:16px;padding:10px 13px;font-size:14px;color:#6c5566;box-shadow:0 3px 10px rgba(185,110,152,.06)}
#top button.on{background:linear-gradient(180deg,#e8b2cc 0%,#cc8db2 100%);color:#fff;border-color:#d59abd}
#progWrap{flex:1;min-width:0;padding:0 6px}
#progText{text-align:center;font-size:13px;color:#9d8ea0;margin-bottom:4px}
#bar{height:8px;background:#f4ebf2;border-radius:999px;overflow:hidden;border:1px solid #ecdfeb}
#barIn{height:100%;width:0;background:linear-gradient(90deg,#f6c9db,#b9ebdf,#cbdfff,#d9c3ff);border-radius:999px;transition:width .25s ease}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#wrap{flex:1;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 38%, #ffffff 0%, #fffafd 68%, #fff6fb 100%)}
#cv,#fx{position:absolute;left:0;top:0;transform-origin:0 0}
#fx{pointer-events:none}
#pal{display:flex;gap:10px;overflow-x:auto;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);background:rgba(255,255,255,.75);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.pc{flex:none;width:60px;height:82px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;background:#fff;border:1px solid #eee1eb;box-shadow:0 6px 15px rgba(185,110,152,.09);position:relative;color:#7a6170}
.pc.on{outline:3px solid #ddb4cc;outline-offset:0;transform:translateY(-1px)}
.pc.done{opacity:.35;filter:saturate(.7)}
.pc .thumb{width:38px;height:38px;display:flex;align-items:center;justify-content:center;margin-bottom:3px}
.pc img,.pc canvas{max-width:38px;max-height:38px;display:block}
.pc .n{font-weight:700;line-height:1}
.pc .left{font-size:10px;color:#b09aaa;margin-top:3px}
@media (orientation:landscape) and (min-width:820px){
 #main{flex-direction:row}
 #pal{flex-direction:column;overflow-y:auto;overflow-x:hidden;width:96px;padding:12px}
 .pc{width:72px;height:88px}
 .pc .thumb{width:44px;height:44px}
 .pc img,.pc canvas{max-width:44px;max-height:44px}
}
#done{position:fixed;inset:0;background:rgba(255,251,253,.92);backdrop-filter:blur(10px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20;padding:18px}
#done .title{font-family:'Snell Roundhand','Apple Chancery',cursive;font-size:42px;color:#c47ea7}
#done img{max-width:86vw;max-height:52vh;border-radius:24px;box-shadow:0 16px 40px rgba(185,110,152,.18);background:#fff}
#done video{max-width:80vw;max-height:40vh;display:none;border-radius:16px}
#help{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 102px);background:rgba(255,255,255,.82);border:1px solid var(--line);color:#9f87a0;padding:8px 12px;border-radius:999px;font-size:12px;box-shadow:0 6px 16px rgba(185,110,152,.08);pointer-events:none;opacity:.92;display:none}
.small{font-size:12px;color:#a08fa0}
</style></head><body>

 <div class="hero"><h1>My Gems</h1><div class="sub">jewel atelier</div></div>
 <div class="tabs" id="tabs"></div>

</div>
<div id="game">
 <div id="top">
  <button id="bHome">🏠</button>
  <button id="bFind">찾기</button>
  <div id="progWrap"><div id="progText">0%</div><div id="bar"><div id="barIn"></div></div></div>
  <button id="bSpark" class="on">✨</button>
  <button id="bSnd">🔊</button>
 </div>
 <div id="main"><div id="wrap"><canvas id="cv"></canvas><canvas id="fx"></canvas></div><div id="pal"></div></div>
</div>
<div id="done">
 <div class="title">Beautiful!</div>
 <img id="dImg"><video id="dVid" playsinline controls></video>
 <div class="small">예쁜 보석이 완성됐어 ✨</div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
  <button class="btn" id="bPng">🖼 이미지 저장</button><button class="btn" id="bVid">🎬 타임랩스 영상</button><button class="btn" id="bClose">갤러리로</button>
 </div>
</div>

const IMG={};
const atlas=new Image();
atlas.decoding='async';
atlas.onload=()=>{if(typeof st!=='undefined'&&st){redraw();palette()}};
atlas.src=GEM_ATLAS;
const SW=96,SH=104;
const srcSh=Object.fromEntries(SHAPES.map((s,i)=>[s,i]));
function imgFor(shape,color,large=false){
 const k=shape+'_'+color;
 if(IMG[k])return IMG[k];
 const el=document.createElement('canvas');el.width=SW;el.height=SH;
 if(!(atlas.complete&&atlas.naturalWidth))return el;
 const ix=srcSh[shape]??0;
 el.getContext('2d').drawImage(atlas,ix*SW,color*SH,SW,SH,0,0,SW,SH);
 IMG[k]=el;
 return el;
}
function preloadAssets(){}

function shade(h,a){let n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,a>0?v+(255-v)*a:v*(1+a)))|0;return`rgb(${f(r)},${f(g)},${f(b)})`}
function hexRgb(h){const n=parseInt(h.slice(1),16);return [n>>16,n>>8&255,n&255]}
function dist(a,b){return (a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2}
function sat(rgb){const [r,g,b]=rgb.map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b);return mx?((mx-mn)/mx):0}
function lum(rgb){return rgb[0]*.299+rgb[1]*.587+rgb[2]*.114}
const PRGB=COLORS.map(c=>hexRgb(c.hex));
function nearestPalette(rgb){let best=0,bd=1e18;for(let i=0;i<PRGB.length;i++){let d=dist(rgb,PRGB[i]);const g=COLORS[i].group==='soft'?.94:1;d*=g;if(d<bd){bd=d;best=i}}return best}

function bgGrad(c,a,b){const g=c.createLinearGradient(0,0,512,512);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.fillRect(0,0,512,512)}
function emo(c,e,x,y,s){c.font=s+'px "Apple Color Emoji"';c.textAlign='center';c.textBaseline='middle';c.fillText(e,x,y)}
function pearls(c,r,col,n){for(let i=0;i<n;i++){const a=i/n*Math.PI*2;c.fillStyle=col;c.beginPath();c.arc(256+Math.cos(a)*r,256+Math.sin(a)*r,9,0,7);c.fill()}}
function scatter(c,list,n,seed){let s=seed;const R=()=>(s=(s*9301+49297)%233280)/233280;for(let i=0;i<n;i++){const x=R()*512,y=R()*512;if(Math.hypot(x-256,y-256)<170)continue;emo(c,list[i%list.length],x,y,30+R()*24)}}
function ribbon(c,col){c.fillStyle=col;c.fillRect(0,440,512,40);emo(c,'🎀',256,455,80)}
function text(c,t,y,s,col){c.font=`bold ${s}px ${SCRIPT}`;c.textAlign='center';c.textBaseline='middle';c.lineWidth=10;c.strokeStyle='#fff';c.strokeText(t,256,y);c.fillStyle=col;c.fillText(t,256,y)}

function build(d){
 const src=document.createElement('canvas');src.width=src.height=512;const sx=src.getContext('2d');sx.fillStyle='#fff';sx.fillRect(0,0,512,512);d.draw(sx);

 for(let i=0;i<COLS*COLS;i++) pts.push([img[i*4],img[i*4+1],img[i*4+2]]);
 let centers=[];for(let i=0;i<K;i++) centers.push(pts[(i*pts.length/K+i*37)%pts.length|0].slice());
 const labels=new Array(pts.length);
 for(let it=0;it<11;it++){const sums=centers.map(()=>[0,0,0,0]);
   pts.forEach((p,i)=>{let b=0,bd=1e9;centers.forEach((c,j)=>{const dd=dist(p,c);if(dd<bd){bd=dd;b=j}});labels[i]=b;sums[b][0]+=p[0];sums[b][1]+=p[1];sums[b][2]+=p[2];sums[b][3]++});
   sums.forEach((v,j)=>{if(v[3]) centers[j]=[v[0]/v[3],v[1]/v[3],v[2]/v[3]]})}
 const clInfo=centers.map(c=>({rgb:c,p:nearestPalette(c)}));
 const compact=new Map(),slots=[];
 labels.forEach(lab=>{const pal=clInfo[lab].p;if(!compact.has(pal)){compact.set(pal,slots.length);slots.push({src:pal,color:COLORS[pal].hex})}});
 const groups=Array.from({length:slots.length},()=>[]);
 labels.forEach((lab,i)=>groups[compact.get(clInfo[lab].p)].push(i));
 const order=slots.map((s,slot)=>{const arr=groups[slot]||[];let L=0;arr.forEach(i=>L+=lum(pts[i]));return {slot,lu:arr.length?L/arr.length:0}}).sort((a,b)=>a.lu-b.lu);
 order.forEach((o,ord)=>slots[o.slot].shape=shapeForColor(slots[o.slot].src,ord));
 const cells=new Array(labels.length);
 for(let i=0;i<labels.length;i++){const slot=compact.get(clInfo[labels[i]].p);const col=i%COLS,row=(i/COLS)|0;const n=noise2d(col,row,slot*13+7);const sh=slots[slot].shape;cells[i]={c:slot,s:sizeFor(col,row,slot,n),r:sh==='round'?0:(n-.5)*.35,f:0}}

}
function noise2d(x,y,s){const v=Math.sin((x*12.9898+y*78.233+s*37.719))*43758.5453;return v-Math.floor(v)}
function shapeForColor(pal,ord){const name=COLORS[pal].name;if(/진주|아이보리|미색|다이아/.test(name)) return ['round','oval','cushion','pear'][ord%4];if(/민트|옥색|아쿠아|연하늘/.test(name)) return ['round','oval','pear','marquise'][ord%4];if(/라벤더|연보라|자수정|오로라/.test(name)) return ['marquise','trillion','oval','round'][ord%4];if(/연핑크|파스텔 핑크|분홍|코랄|다홍/.test(name)) return ['heart','oval','cushion','pear'][ord%4];if(/버터 옐로|노랑|골드|샴페인/.test(name)) return ['cushion','emerald','round','trillion'][ord%4];if(/진초록/.test(name)) return 'emerald';if(/청록|진한 하늘|파랑|남색/.test(name)) return ['pear','marquise','round','emerald','trillion'][ord%5];return SHAPES[ord%SHAPES.length]}

function shapePath(x,sh,R){x.beginPath();if(sh=='round')x.arc(0,0,R,0,7);else if(sh=='oval')x.ellipse(0,0,R*.75,R,0,0,7);else if(sh=='marquise'){x.moveTo(0,-R);x.quadraticCurveTo(R*1.05,0,0,R);x.quadraticCurveTo(-R*1.05,0,0,-R)}else if(sh=='pear'){x.moveTo(0,-R);x.quadraticCurveTo(R*.9,R*.1,R*.72,R*.42);x.arc(0,R*.42,R*.72,0,Math.PI);x.quadraticCurveTo(-R*.9,R*.1,0,-R)}else if(sh=='heart'){x.moveTo(0,R*.94);x.bezierCurveTo(-R*1.2,0,-R*.7,-R*.96,0,-R*.35);x.bezierCurveTo(R*.7,-R*.96,R*1.2,0,0,R*.94)}else if(sh=='cushion'){const r=R*.42;x.roundRect(-R*.9,-R*.9,R*1.8,R*1.8,r)}else if(sh=='emerald'){const a=R*.7,b=R*.96,k=R*.22;x.moveTo(-a+k,-b);x.lineTo(a-k,-b);x.lineTo(a,-b+k);x.lineTo(a,b-k);x.lineTo(a-k,b);x.lineTo(-a+k,b);x.lineTo(-a,b-k);x.lineTo(-a,-b+k)}else{x.moveTo(0,-R);x.lineTo(R*.95,R*.68);x.lineTo(-R*.95,R*.68)}x.closePath()}

function loop(){requestAnimationFrame(loop);if(!st||$('game').style.display=='none') return;fc.clearRect(0,0,W,W);drops=drops.filter(d=>{d.t+=.1;const c=st.cells[d.i],x=(d.i%COLS)*CELL+CELL/2,y=(d.i/COLS|0)*CELL+CELL/2;if(d.t>=1){landed(d.i);return false}const e=1-(1-d.t)**3,sc=2.3-1.3*e,z=CELL*1.1*c.s*sc;fc.save();fc.globalAlpha=.17*e;fc.fillStyle='#000';fc.beginPath();fc.ellipse(x,y+3,z*.28,z*.13,0,0,7);fc.fill();fc.restore();drawGem(fc,c.c,x,y-(1-e)*CELL*1.9,z,.98);return true});fc.globalCompositeOperation='lighter';flash=flash.filter(f=>{f.l-=.05;star(f.x,f.y,CELL*1.06*f.l,`rgba(255,255,255,${f.l})`);return f.l>0});if(sparkOn&&Math.random()<.28){for(let k=0;k<4;k++){const i=(Math.random()*st.cells.length)|0;if(st.cells[i].f==1) twinkle.push({i,l:1})}}twinkle=twinkle.filter(w=>{w.l-=.04;const x=(w.i%COLS)*CELL+CELL*.35,y=(w.i/COLS|0)*CELL+CELL*.35;star(x+tilt.x,y+tilt.y,CELL*.64*Math.sin(w.l*Math.PI),'rgba(255,255,255,.94)');return w.l>0});parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.038;p.l-=.025;fc.globalAlpha=Math.max(p.l,0);if(p.c=='#fff') star(p.x,p.y,p.s*2.2,'#fff');else {fc.fillStyle=p.c;fc.beginPath();fc.arc(p.x,p.y,p.s,0,7);fc.fill()}return p.l>0});fc.globalAlpha=1;fc.globalCompositeOperation='source-over'}

function star(x,y,r,col){if(r<=0)return;fc.save();fc.translate(x,y);const g=fc.createRadialGradient(0,0,0,0,0,r*.65);g.addColorStop(0,col);g.addColorStop(1,'rgba(255,255,255,0)');fc.fillStyle=g;fc.beginPath();fc.arc(0,0,r*.55,0,7);fc.fill();fc.fillStyle=col;fc.beginPath();for(let k=0;k<4;k++){fc.rotate(Math.PI/2);fc.moveTo(0,0);fc.lineTo(r*.12,r*.12);fc.lineTo(0,r);fc.lineTo(-r*.12,r*.12)}fc.fill();fc.restore()}
addEventListener('deviceorientation',e=>{tilt.x=(e.gamma||0)/15;tilt.y=((e.beta||0)-40)/15});
/* 소리 */
let ac;function ting(){if(!snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=1650+Math.random()*600;g.gain.setValueAtTime(.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.22);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.22)}catch(e){}}
/* 버튼 */
$('bHome').onclick=()=>{save();home()};
$('bSnd').onclick=()=>{snd=!snd;$('bSnd').textContent=snd?'🔊':'🔇';if(snd&&window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().catch(()=>{})};
$('bSpark').onclick=()=>{sparkOn=!sparkOn;$('bSpark').classList.toggle('on',sparkOn);if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().catch(()=>{})};
$('bFind').onclick=()=>{const i=st.cells.findIndex(c=>c.c==sel&&!c.f);if(i<0)return;const r=wrap.getBoundingClientRect();view.s=Math.max(view.s,2.6);view.x=r.width/2-((i%COLS)*CELL+CELL/2)*view.s;view.y=r.height/2-((i/COLS|0)*CELL+CELL/2)*view.s;apply();flash.push({x:(i%COLS)*CELL+CELL/2,y:(i/COLS|0)*CELL+CELL/2,l:1})};
addEventListener('resize',()=>{if(st&&$('game').style.display!='none')setTimeout(fit,120)});
/* 완성/저장 */
function render(n,size){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),s=size/COLS;x.fillStyle='#fff';x.fillRect(0,0,size,size);const on=new Set(st.order.slice(0,n));st.cells.forEach((cl,i)=>{if(!on.has(i))return;const z=s*1.08*cl.s;drawGem(x,cl.c,(i%COLS)*s+s/2,(i/COLS|0)*s+s/2,z,1)});return c}
function finish(){st.done=true;save();const img=render(st.order.length,1600).toDataURL('image/jpeg',.94);galAdd({img,order:st.order,st:{slots:st.slots,cells:st.cells},progress:100});for(let k=0;k<200;k++)twinkle.push({i:(Math.random()*st.cells.length)|0,l:1});setTimeout(()=>showDone(img),900)}
let doneSt=null;
function showDone(img,order,s){if(s)doneSt={...s,order};else doneSt=null;$('dImg').src=img;$('dVid').style.display='none';$('done').style.display='flex'}
$('bClose').onclick=()=>{$('done').style.display='none';localStorage.removeItem(KEY);cat='내 작품';home()};
$('bPng').onclick=async()=>{const b=await (await fetch($('dImg').src)).blob();const f=new File([b],'mygems.jpg',{type:b.type});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=$('dImg').src;a.download='mygems.jpg';a.click()}};
$('bVid').onclick=()=>{const keep=st;if(doneSt)st=doneSt;if(!window.MediaRecorder){alert('이 기기에서는 영상 저장이 안 돼요 (iOS 14.5 이상 필요)');st=keep;return}const size=1080,c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),stream=c.captureStream(30);const mt=MediaRecorder.isTypeSupported('video/mp4')?'video/mp4':'video/webm',rec=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:6e6}),chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{const b=new Blob(chunks,{type:mt}),u=URL.createObjectURL(b);const v=$('dVid');v.src=u;v.style.display='block';const f=new File([b],'mygems.'+(mt.includes('mp4')?'mp4':'webm'),{type:mt});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});st=keep};const N=st.order.length,frames=Math.min(300,Math.max(140,N/10|0));let f=0;rec.start();$('bVid').textContent='⏳ 만드는 중…';const s=size/COLS;x.fillStyle='#fff';x.fillRect(0,0,size,size);let drawn=0;const tick=()=>{const to=Math.min(N,Math.ceil(N*(f+1)/frames));for(;drawn<to;drawn++){const i=st.order[drawn],cl=st.cells[i],z=s*1.08*cl.s;drawGem(x,cl.c,(i%COLS)*s+s/2,(i/COLS|0)*s+s/2,z,1)}f++;if(f<frames+42)setTimeout(tick,33);else{rec.stop();$('bVid').textContent='🎬 타임랩스 영상'}};tick()};
/* 갤러리: 일부 파일 미리보기·개인정보 보호 모드에서도 흰 화면 방지 */
let db=null;
const FALLBACK_GALLERY='mygems-atelier-finished-fallback';
function fallbackRead(){try{return JSON.parse(localStorage.getItem(FALLBACK_GALLERY)||'[]')}catch(e){return []}}
function fallbackAdd(w){try{const a=fallbackRead();a.push(w);localStorage.setItem(FALLBACK_GALLERY,JSON.stringify(a.slice(-10)))}catch(e){}}
const dbp=new Promise(resolve=>{
 try {
  if(!window.indexedDB){resolve(false);return}
  const q=indexedDB.open('mygemsAtelier',1);
  q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('w'))q.result.createObjectStore('w',{autoIncrement:true})};
  q.onsuccess=()=>{db=q.result;resolve(true)};
  q.onerror=()=>resolve(false);
  q.onblocked=()=>resolve(false);
 }catch(e){resolve(false)}
});
function galAdd(w){dbp.then(ok=>{if(!ok){fallbackAdd(w);return}try{const q=db.transaction('w','readwrite').objectStore('w').add(w);q.onerror=()=>fallbackAdd(w)}catch(e){fallbackAdd(w)}})}
function galAll(cb){dbp.then(ok=>{if(!ok){cb(fallbackRead());return}try{const q=db.transaction('w','readonly').objectStore('w').getAll();q.onsuccess=()=>cb(q.result);q.onerror=()=>cb(fallbackRead())}catch(e){cb(fallbackRead())}})}
home();
</script></body></html>
