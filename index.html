<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>My Gems · V5.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#fffafc;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#6a5765;overflow:hidden}
button{font:inherit}
#home{position:fixed;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 34px}
.hero{text-align:center;padding:2px 0 12px}
.hero h1{font-family:'Snell Roundhand','Apple Chancery',cursive;font-size:42px;margin:4px 0;color:#b96e98;font-weight:500}
.hero .sub{font-size:12px;letter-spacing:3px;color:#b797ae;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:10px}
.card{aspect-ratio:4/5;border-radius:22px;background:#fff;box-shadow:0 8px 28px rgba(185,110,152,.12);overflow:hidden;position:relative;border:1px solid #f0e3ec}
.card canvas{width:100%;height:100%;display:block}
.card .bd{position:absolute;left:7px;right:7px;bottom:8px;font-size:11px;background:rgba(255,255,255,.8);border:1px solid #ecdde8;color:#8d7484;border-radius:10px;padding:3px 6px;text-align:center}
.card .pct{position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:999px;background:#fff;color:#8e7084;font-size:11px;border:1px solid #ecdde8}
#game{position:fixed;inset:0;display:none;flex-direction:column;background:#fffafc}
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
#top button,.btn{border:1px solid #ecdde8;background:#fff;border-radius:16px;padding:10px 13px;font-size:14px;color:#6c5566}
#top button.on{background:linear-gradient(180deg,#e8b2cc,#cc8db2);color:#fff;border-color:#d59abd}
#progWrap{flex:1;min-width:0;padding:0 6px}
#progText{text-align:center;font-size:12px;color:#9d8ea0;margin-bottom:4px}
#bar{height:8px;background:#f4ebf2;border-radius:999px;overflow:hidden}
#barIn{height:100%;width:0;background:linear-gradient(90deg,#f6c9db,#b9ebdf,#cbdfff,#d9c3ff);transition:width .25s}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#wrap{flex:1;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 40%,#fff,#fff6fa)}
#cv{position:absolute;left:0;top:0}
#fx{position:fixed;left:0;top:0;pointer-events:none;z-index:15}
#pal{display:flex;gap:10px;overflow-x:auto;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);background:rgba(255,255,255,.85);border-top:1px solid #ecdde8}
.pc{flex:none;width:62px;height:86px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;background:#fff;border:1px solid #eee1eb;box-shadow:0 6px 15px rgba(185,110,152,.09);color:#7a6170}
.pc.on{outline:3px solid #ddb4cc}
.pc.done{opacity:.4}
.pc .thumb{width:38px;height:38px}
.pc .thumb canvas{width:38px;height:38px}
.pc .n{font-weight:700}
.pc .left{font-size:10px;color:#b09aaa;margin-top:1px}
.pc .mini{width:38px;height:4px;border-radius:9px;background:#f1e6ee;overflow:hidden;margin-top:3px}
.pc .mini i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f3bfd6,#c8eadd,#cfdfff)}
@media (orientation:landscape) and (min-width:820px){
 #main{flex-direction:row}
 #pal{flex-direction:column;overflow-y:auto;overflow-x:hidden;width:98px;padding:12px;border-top:0;border-left:1px solid #ecdde8}
}
#done{position:fixed;inset:0;background:rgba(255,251,253,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20;padding:18px}
#done .title{font-family:'Snell Roundhand','Apple Chancery',cursive;font-size:42px;color:#c47ea7}
#done img{max-width:86vw;max-height:52vh;border-radius:20px;box-shadow:0 16px 40px rgba(185,110,152,.18)}
#done video{max-width:80vw;max-height:34vh;display:none;border-radius:16px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);background:#fff;border:1px solid #ecdde8;color:#9f87a0;padding:8px 14px;border-radius:999px;font-size:13px;box-shadow:0 6px 16px rgba(185,110,152,.1);z-index:30;opacity:0;transition:opacity .3s;pointer-events:none}
</style></head><body>
<div id="home"><div class="hero"><h1>My Gems</h1><div class="sub">jewel atelier</div></div><div class="grid" id="list"></div></div>
<div id="game">
 <div id="top"><button id="bHome">🏠</button><button id="bFind">찾기</button>
  <div id="progWrap"><div id="progText">0%</div><div id="bar"><div id="barIn"></div></div></div>
  <button id="bSpark" class="on">✨</button><button id="bSnd" class="on">🔊</button></div>
 <div id="main"><div id="wrap"><canvas id="cv"></canvas></div><div id="pal"></div></div>
</div>
<canvas id="fx"></canvas>
<div id="done"><div class="title">Beautiful!</div><img id="dImg"><video id="dVid" playsinline controls></video>
 <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
 <button class="btn" id="bPng">🖼 이미지 저장</button><button class="btn" id="bVid">🎬 타임랩스 영상</button><button class="btn" id="bReset">처음부터</button><button class="btn" id="bClose">갤러리로</button></div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const DPR=Math.min(window.devicePixelRatio||1,2);
const SCRIPT='"Snell Roundhand","Apple Chancery","Savoye LET","Brush Script MT",cursive';
const SHAPES=['round','oval','marquise','pear','heart','cushion','emerald','trillion'];
const COL={'진주':'#f8f3eb','아이보리':'#fff4df','미색':'#f7e8d4','연핑크':'#ffd3e5','파스텔 핑크':'#f5add0','민트':'#a1edda','옥색':'#9bcfbe','아쿠아':'#a5e8ed','연하늘':'#c4e6f9','라벤더':'#d6bcf7','연보라':'#bca2f0','연두':'#c7e88f','버터 옐로':'#ffe6a1','샴페인':'#efcfb7','빨강':'#db284e','버건디':'#842847','다홍':'#f06b4c','분홍':'#e76a9f','코랄':'#f48e80','노랑':'#f9cf3e','골드':'#cda03c','진초록':'#187b55','청록':'#167b88','진한 하늘':'#398fc9','파랑':'#2262d3','남색':'#253c87','자수정':'#9559c4','다이아':'#edf6ff','오로라':'#e3c6f1'};
const COLN=Object.keys(COL);

/* ---------- 색 도구 ---------- */
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const toHex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return toHex(A.map((v,i)=>v+(B[i]-v)*t))};
const lum=h=>{const a=hx(h);return(.299*a[0]+.587*a[1]+.114*a[2])/255};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,1600);}

/* ---------- 도형 도구 ---------- */
function resample(poly,N){const L=[0];let tot=0;
 for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];tot+=Math.hypot(b[0]-a[0],b[1]-a[1]);L.push(tot);}
 const out=[];let j=0;
 for(let k=0;k<N;k++){const s=k/N*tot;while(j<poly.length-1&&L[j+1]<s)j++;const a=poly[j],b=poly[(j+1)%poly.length];const t=(s-L[j])/((L[j+1]-L[j])||1);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}
 return out;}
function perim(P){let t=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];t+=Math.hypot(b[0]-a[0],b[1]-a[1]);}return t;}
function star4(c,X,Y,s){c.beginPath();c.moveTo(X,Y-s);c.quadraticCurveTo(X+s*.18,Y-s*.18,X+s,Y);c.quadraticCurveTo(X+s*.18,Y+s*.18,X,Y+s);c.quadraticCurveTo(X-s*.18,Y+s*.18,X-s,Y);c.quadraticCurveTo(X-s*.18,Y-s*.18,X,Y-s);c.fill();}

/* ---------- 보석 모양 (V4 모양 그대로) ---------- */
const ROT={oval:Math.PI/2,marquise:Math.PI/2,pear:Math.PI/2,emerald:Math.PI/2},KS={pear:.88};
function gemShape(x,sh,R){
 if(sh=='round')x.arc(0,0,R,0,7);
 else if(sh=='oval')x.ellipse(0,0,R*.75,R,0,0,7);
 else if(sh=='marquise'){x.moveTo(0,-R);x.quadraticCurveTo(R*1.05,0,0,R);x.quadraticCurveTo(-R*1.05,0,0,-R)}
 else if(sh=='pear'){x.moveTo(0,-R);x.quadraticCurveTo(R*.9,R*.1,R*.72,R*.42);x.arc(0,R*.42,R*.72,0,Math.PI);x.quadraticCurveTo(-R*.9,R*.1,0,-R)}
 else if(sh=='heart'){x.moveTo(0,R*.94);x.bezierCurveTo(-R*1.2,0,-R*.7,-R*.96,0,-R*.35);x.bezierCurveTo(R*.7,-R*.96,R*1.2,0,0,R*.94)}
 else if(sh=='cushion'){const r=R*.42,a=R*.9;x.moveTo(-a+r,-a);x.arcTo(a,-a,a,a,r);x.arcTo(a,a,-a,a,r);x.arcTo(-a,a,-a,-a,r);x.arcTo(-a,-a,a,-a,r)}
 else if(sh=='emerald'){const a=R*.7,b=R*.96,k=R*.22;x.moveTo(-a+k,-b);x.lineTo(a-k,-b);x.lineTo(a,-b+k);x.lineTo(a,b-k);x.lineTo(a-k,b);x.lineTo(-a+k,b);x.lineTo(-a,b-k);x.lineTo(-a,-b+k)}
 else{x.moveTo(0,-R);x.lineTo(R*.95,R*.68);x.lineTo(-R*.95,R*.68)}
 x.closePath();}
const SHP={};
SHAPES.forEach(s=>{const raw=new Path2D();gemShape(raw,s,KS[s]||1);let p=raw;
 if(ROT[s]){try{p=new Path2D();p.addPath(raw,new DOMMatrix().rotate(90));}catch(e){p=raw}}SHP[s]=p;});

/* ---------- 보석 이미지: V4 아틀라스 (96x104 칸, 가로=모양, 세로=색) ---------- */
const AW=96,AH=104,S=192,RS=76;let SPR={},atlasOK=false;
const atlas=new Image();atlas.decoding='async';
function sprite(shape,cn){const key=shape+'|'+cn;if(SPR[key])return SPR[key];
 const cv=document.createElement('canvas');cv.width=cv.height=S;const x=cv.getContext('2d');
 x.translate(S/2,S/2);x.scale(RS,RS);
 x.save();x.shadowColor='rgba(160,140,152,.3)';x.shadowBlur=RS*.18;x.shadowOffsetY=RS*.08;x.fillStyle='rgba(255,255,255,.95)';x.fill(SHP[shape]);x.restore();
 x.save();x.clip(SHP[shape]);
 if(atlasOK){x.rotate(ROT[shape]||0);const k=KS[shape]||1,w=k/.48,z=w*AH/AW,ci=Math.max(0,COLN.indexOf(cn)),ix=Math.max(0,SHAPES.indexOf(shape));
  x.drawImage(atlas,ix*AW,ci*AH,AW,AH,-w/2,-z/2,w,z);}
 else{const c=COL[cn]||'#ccc',g=x.createRadialGradient(-.3,-.35,.05,0,0,1.1);g.addColorStop(0,'#fff');g.addColorStop(.35,c);g.addColorStop(1,mix(c,'#000',.25));x.fillStyle=g;x.fillRect(-1.6,-1.6,3.2,3.2);}
 x.restore();return SPR[key]=cv;}
function loadAtlas(){
 const names=['v4.txt','MyGems_V4_전체코드.txt','MyGems_V4_%25EC%25A0%2584%25EC%25B2%25B4%25EC%25BD%2594%25EB%2593%259C.txt'];
 const tryN=k=>{if(k>=names.length){toast('보석 이미지 파일(v4.txt)을 못 찾았어요');return;}
  fetch(names[k],{cache:'force-cache'}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{const m=t.match(/GEM_ATLAS\s*=\s*'([^']+)'/);if(!m)throw 0;
   atlas.onload=()=>{atlasOK=true;SPR={};if(active){buildPal();dirty=true;}else showHome();};atlas.src=m[1];}).catch(()=>tryN(k+1));};
 tryN(0);}

/* ---------- 도안 → 보석 좌표 (획/윤곽 따라 배치) ---------- */
function chamfer(d,W,H){const r2=1.4142;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;let v=d[i];if(!v)continue;
  v=Math.min(v,x+1,y+1,W-x,H-y);if(x>0)v=Math.min(v,d[i-1]+1);
  if(y>0){v=Math.min(v,d[i-W]+1);if(x>0)v=Math.min(v,d[i-W-1]+r2);if(x<W-1)v=Math.min(v,d[i-W+1]+r2);}d[i]=v;}
 for(let y=H-1;y>=0;y--)for(let x=W-1;x>=0;x--){const i=y*W+x;let v=d[i];if(!v)continue;
  if(x<W-1)v=Math.min(v,d[i+1]+1);
  if(y<H-1){v=Math.min(v,d[i+W]+1);if(x<W-1)v=Math.min(v,d[i+W+1]+r2);if(x>0)v=Math.min(v,d[i+W-1]+r2);}d[i]=v;}}
function buildLayout(D){
 const W=D.w,H=D.h,cv=document.createElement('canvas');cv.width=W;cv.height=H;
 const x=cv.getContext('2d',{willReadFrequently:true});
 const CE=16,gw=Math.ceil(W/CE),gh=Math.ceil(H/CE),grid=[];for(let i=0;i<gw*gh;i++)grid.push([]);
 const gems=[],pal=[],pk={},GAP=.7;
 const cell=(v,m)=>Math.max(0,Math.min(m-1,Math.floor(v/CE)));
 const put=g=>{gems.push(g);grid[cell(g[1],gh)*gw+cell(g[0],gw)].push(g)};
 const avail=(px,py,lim)=>{let a=lim;const R=lim+14;const x0=cell(px-R,gw),x1=cell(px+R,gw),y0=cell(py-R,gh),y1=cell(py+R,gh);
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){const Lc=grid[cy*gw+cx];for(let k=0;k<Lc.length;k++){const g=Lc[k];const dd=Math.hypot(g[0]-px,g[1]-py)-g[2]-GAP;if(dd<a)a=dd;}}return a;};
 const d=new Float32Array(W*H),cover=new Uint8Array(W*H);
 for(const el of D.els){
  const k=el.color+'|'+el.shape;if(pk[k]==null){pk[k]=pal.length;pal.push({color:el.color,shape:el.shape});}const n=pk[k];
  if(el.pts){for(const p of el.pts()){const a=avail(p[0],p[1],p[2]);if(a>=p[2]*.68)put([p[0],p[1],Math.min(a,p[2]),p[3]||0,n]);}continue;}
  x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);x.fillStyle=x.strokeStyle='#fff';x.lineJoin='round';x.lineCap='round';
  el.draw(x);
  const im=x.getImageData(0,0,W,H).data;
  for(let i=0,j=3;i<W*H;i++,j+=4)d[i]=im[j]>127?1e5:0;
  chamfer(d,W,H);
  const cand=[];for(let i=0;i<W*H;i++)if(d[i]>=el.min+.5)cand.push(i);
  cand.sort((a,b)=>d[b]-d[a]);
  cover.fill(0);
  const o=el.orient==null?'flow':el.orient;
  for(const i of cand){if(cover[i])continue;const px=i%W,py=(i-px)/W,cx=px+.5,cy=py+.5;
   const a=avail(cx,cy,Math.min(d[i]-.5,el.max));if(a<el.min)continue;
   let ang=0;
   if(typeof o==='number')ang=o;
   else if(o.radial)ang=Math.atan2(o.radial[1]-cy,o.radial[0]-cx);
   else if(px>1&&py>1&&px<W-2&&py<H-2){const gx=d[i+1]-d[i-1],gy=d[i+W]-d[i-W];
    if(gx*gx+gy*gy>1.2)ang=Math.atan2(gx,-gy);
    else{const s=2,c0=d[i];const dxx=d[i+s]+d[i-s]-2*c0,dyy=d[i+s*W]+d[i-s*W]-2*c0,dxy=(d[i+s+s*W]-d[i-s+s*W]-d[i+s-s*W]+d[i-s-s*W])/4;ang=.5*Math.atan2(2*dxy,dxx-dyy);}}
   put([cx,cy,a,ang,n]);
   const R=Math.ceil(a);for(let yy=-R;yy<=R;yy++){const Y=py+yy;if(Y<0||Y>=H)continue;for(let xx=-R;xx<=R;xx++){const X=px+xx;if(X<0||X>=W)continue;if(xx*xx+yy*yy<=a*a)cover[Y*W+X]=1;}}
  }
 }
 return{gems:gems.map(g=>[+g[0].toFixed(1),+g[1].toFixed(1),+g[2].toFixed(2),+g[3].toFixed(2),g[4]]),pal};}

/* ---------- 도안: Happy Anniversary ---------- */
function scriptText(x,t,cx,y,size,maxW,thick){x.font='bold '+size+'px '+SCRIPT;const w=x.measureText(t).width;if(w>maxW){size=size*maxW/w;x.font='bold '+size+'px '+SCRIPT;}
 x.textAlign='center';x.textBaseline='alphabetic';x.lineWidth=thick;x.fillText(t,cx,y);x.strokeText(t,cx,y);}
function heartPath(x,cx,cy,s){x.beginPath();x.moveTo(cx,cy+s*.9);x.bezierCurveTo(cx-s*1.3,cy+s*.1,cx-s*.9,cy-s*.95,cx,cy-s*.45);x.bezierCurveTo(cx+s*.9,cy-s*.95,cx+s*1.3,cy+s*.1,cx,cy+s*.9);x.closePath();}
function archPts(ins){const L=50+ins,R=670-ins,B=860-ins,cx=360,cy=300,rx=310-ins,ry=250-ins,raw=[];
 for(let y=B;y>cy;y-=2)raw.push([L,y]);
 for(let t=Math.PI;t<=2*Math.PI;t+=.01)raw.push([cx+rx*Math.cos(t),cy+ry*Math.sin(t)]);
 for(let y=cy;y<B;y+=2)raw.push([R,y]);
 for(let X=R;X>L;X-=2)raw.push([X,B]);return raw;}
function flowerEls(cx,cy){return[
 {color:'버터 옐로',shape:'round',min:3,max:7,draw:x=>{x.beginPath();x.arc(cx,cy,15,0,7);x.fill()}},
 {color:'파스텔 핑크',shape:'pear',min:3,max:8,orient:{radial:[cx,cy]},draw:x=>{for(let k=0;k<6;k++){const a=k*Math.PI/3-Math.PI/2;x.beginPath();x.ellipse(cx+Math.cos(a)*31,cy+Math.sin(a)*31,24,15,a,0,7);x.fill();}}},
 {color:'옥색',shape:'marquise',min:2.6,max:6.5,orient:{radial:[cx,cy]},draw:x=>{[-145,-35].forEach(dg=>{const a=dg*Math.PI/180;x.beginPath();x.ellipse(cx+Math.cos(a)*66,cy+Math.sin(a)*66,26,10,a,0,7);x.fill();});}}];}
const ANNIV={id:'anniv',ver:'1',title:'Happy Anniversary',w:720,h:900,bg:'#fffaf6',els:[
 {color:'버건디',shape:'round',min:2.4,max:6.5,draw:x=>scriptText(x,'Happy',360,350,170,470,6)},
 {color:'분홍',shape:'round',min:2.4,max:6,draw:x=>scriptText(x,'Anniversary',360,490,118,540,5)},
 {color:'빨강',shape:'heart',min:3,max:9,orient:0,draw:x=>{heartPath(x,392,672,58);x.fill()}},
 {color:'파스텔 핑크',shape:'heart',min:3,max:8,orient:0,draw:x=>{heartPath(x,318,652,46);x.fill()}},
 ...flowerEls(148,782),...flowerEls(572,782),
 {color:'자수정',shape:'round',min:2,max:5,draw:x=>{star4(x,232,160,26);star4(x,196,200,13);star4(x,488,160,26);star4(x,524,200,13)}},
 {color:'민트',shape:'oval',min:2.4,max:4.8,draw:x=>{x.lineWidth=8;x.beginPath();for(let X=250;X<=470;X+=2){const y=548+7*Math.sin((X-250)/220*Math.PI*3);X===250?x.moveTo(X,y):x.lineTo(X,y);}x.stroke()}},
 {color:'골드',shape:'oval',min:3,max:7,draw:x=>{x.lineWidth=15;x.beginPath();archPts(0).forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.stroke()}},
 {color:'진주',shape:'round',pts:()=>{const P=archPts(30);return resample(P,Math.round(perim(P)/20)).map(p=>[p[0],p[1],5.2])}}
]};
const DESIGNS=[ANNIV];

/* ---------- 공통 렌더 (썸네일·게임·완성본·영상 모두 이것) ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawGemAt(ctx,g,P,sc,ox,oy,dpr){const pp=P[g[4]],m=g[2]/RS*sc*dpr,a=pp.shape==='round'?0:g[3],c=Math.cos(a),sn=Math.sin(a);
 ctx.setTransform(m*c,m*sn,-m*sn,m*c,(ox+g[0]*sc)*dpr,(oy+g[1]*sc)*dpr);ctx.drawImage(sprite(pp.shape,pp.color),-S/2,-S/2);}
function render(ctx,D,L,o){
 const sc=o.sc,ox=o.ox,oy=o.oy,dpr=o.dpr,vw=o.vw||1e5,vh=o.vh||1e5,G=L.gems,P=L.pal,F=o.filled,sel=o.sel,skip=o.skip;
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.save();ctx.shadowColor='rgba(185,110,152,.18)';ctx.shadowBlur=18*dpr;ctx.shadowOffsetY=5*dpr;ctx.fillStyle=D.bg;rr(ctx,ox,oy,D.w*sc,D.h*sc,20*sc);ctx.fill();ctx.restore();
 const vis=g=>{const X=ox+g[0]*sc,Y=oy+g[1]*sc,m=g[2]*sc+4;return X>-m&&Y>-m&&X<vw+m&&Y<vh+m};
 const isF=i=>!F||(F[i]&&!(skip&&skip.has(i)));
 const nums=[];
 if(F){for(let pass=0;pass<2;pass++)for(let i=0;i<G.length;i++){if(isF(i))continue;const g=G[i],s=g[4]===sel;if(s!==(pass===1)||!vis(g))continue;
  const pp=P[g[4]],m=g[2]*sc*dpr,X=(ox+g[0]*sc)*dpr,Y=(oy+g[1]*sc)*dpr,a=pp.shape==='round'?0:g[3],c=Math.cos(a),sn=Math.sin(a),path=SHP[pp.shape];
  ctx.setTransform(m*c,m*sn,-m*sn,m*c,X,Y);
  if(s){ctx.fillStyle=pp.tint;ctx.fill(path);ctx.lineWidth=1.7*dpr/m;ctx.strokeStyle=pp.edge;ctx.stroke(path);}
  else{ctx.fillStyle='rgba(160,140,155,.10)';ctx.fill(path);ctx.lineWidth=dpr/m;ctx.strokeStyle='rgba(150,128,145,.30)';ctx.stroke(path);}
  if(!o.nonum&&g[2]*sc>=6.5)nums.push(i);}}
 for(let i=0;i<G.length;i++){if(!isF(i))continue;const g=G[i];if(!vis(g))continue;drawGemAt(ctx,g,P,sc,ox,oy,dpr);}
 if(nums.length){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.textAlign='center';ctx.textBaseline='middle';let lf=0;
  for(const i of nums){const g=G[i],fs=Math.min(15,Math.round(g[2]*sc*.9));if(fs!==lf){ctx.font='600 '+fs+'px -apple-system,sans-serif';lf=fs;}
   ctx.fillStyle=g[4]===sel?P[g[4]].edge:'rgba(140,118,134,.55)';ctx.fillText(g[4]+1,ox+g[0]*sc,oy+g[1]*sc+.5);}}
 ctx.setTransform(1,0,0,1,0,0);}
function getLayout(D){const k='mg5-L-'+D.id+'-'+D.ver;let L=null;try{L=JSON.parse(localStorage.getItem(k))}catch(e){}
 if(!L||!L.gems){L=buildLayout(D);try{localStorage.setItem(k,JSON.stringify(L))}catch(e){}}
 L.pal.forEach(p=>{const c=COL[p.color];p.tint=mix(c,'#ffffff',.6);p.edge=lum(c)>.75?mix(c,'#6e5a70',.6):mix(c,'#3a2030',.2)});return L;}
const loadProg=id=>{try{return JSON.parse(localStorage.getItem('mg5-P-'+id))||[]}catch(e){return[]}};

/* ---------- V4 반짝임 / 소리 ---------- */
function star(c,x,y,r,col){if(r<=0)return;c.save();c.translate(x,y);const g=c.createRadialGradient(0,0,0,0,0,r*.65);g.addColorStop(0,col);g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,r*.55,0,7);c.fill();c.fillStyle=col;c.beginPath();for(let k=0;k<4;k++){c.rotate(Math.PI/2);c.moveTo(0,0);c.lineTo(r*.12,r*.12);c.lineTo(0,r);c.lineTo(-r*.12,r*.12)}c.fill();c.restore();}
let ac=null,snd=true;
function audioUnlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume();}catch(e){}}
function ting(){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=1650+Math.random()*600;g.gain.setValueAtTime(.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.22);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.22)}catch(e){}}
const tilt={x:0,y:0};
addEventListener('deviceorientation',e=>{tilt.x=(e.gamma||0)/15;tilt.y=((e.beta||0)-40)/15});

/* ---------- 게임 ---------- */
let D,L,F,order,cnt,tot,sel=0,sc=1,ox=0,oy=0,fit=1,W=0,H=0,dirty=true,active=false,spark=true,wr={left:0,top:0},EXP=null;
const flying=new Set();let fl=[],parts=[],flash=[],twinkle=[];const HC=24;let hit=[],hw=1,hh=1,chips=[],saveT=0;
const wrap=$('wrap'),cv=$('cv'),ctx=cv.getContext('2d'),fx=$('fx'),fctx=fx.getContext('2d');
function openDesign(d){D=d;L=getLayout(D);const G=L.gems;F=new Uint8Array(G.length);order=[];cnt=L.pal.map(()=>0);tot=L.pal.map(()=>0);G.forEach(g=>tot[g[4]]++);
 fl=[];parts=[];flash=[];twinkle=[];flying.clear();
 loadProg(D.id).forEach(i=>{if(i<G.length&&!F[i]){F[i]=1;order.push(i);cnt[G[i][4]]++}});
 hw=Math.ceil(D.w/HC);hh=Math.ceil(D.h/HC);hit=Array.from({length:hw*hh},()=>[]);G.forEach((g,i)=>hit[Math.min(hh-1,Math.floor(g[1]/HC))*hw+Math.min(hw-1,Math.floor(g[0]/HC))].push(i));
 $('home').style.display='none';$('game').style.display='flex';active=true;
 buildPal();resize();fitView();const f=cnt.findIndex((c,n)=>c<tot[n]);select(f<0?0:f);updProg();}
function buildPal(){const pal=$('pal');pal.innerHTML='';chips=L.pal.map((p,n)=>{const d=document.createElement('div');d.className='pc';
 d.innerHTML='<div class="thumb"></div><div class="n">'+(n+1)+'</div><div class="left"></div><div class="mini"><i></i></div>';
 const th=document.createElement('canvas');th.width=th.height=76;th.getContext('2d').drawImage(sprite(p.shape,p.color),0,0,76,76);d.querySelector('.thumb').appendChild(th);
 d.onclick=()=>select(n);pal.appendChild(d);return d;});chips.forEach((c,n)=>updChip(n));if(chips[sel])chips[sel].classList.add('on');}
function updChip(n){const c=chips[n];c.querySelector('.left').textContent=cnt[n]+'/'+tot[n];c.querySelector('.mini i').style.width=(cnt[n]/tot[n]*100)+'%';c.classList.toggle('done',cnt[n]>=tot[n]);}
function updProg(){const t=L.gems.length,p=order.length/t;$('progText').textContent=order.length+' / '+t+' · '+Math.floor(p*100)+'%';$('barIn').style.width=(p*100)+'%';}
function select(n){sel=n;chips.forEach((c,i)=>c.classList.toggle('on',i===n));if(chips[n])chips[n].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});dirty=true;}
function nextNum(){const P=L.pal.length;for(let k=1;k<=P;k++){const m=(sel+k)%P;if(cnt[m]<tot[m]){select(m);toast((m+1)+'번 보석으로 넘어갈게요 ✨');return;}}}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('mg5-P-'+D.id,JSON.stringify(order))}catch(e){}},400);}
function resize(){if(!active)return;W=wrap.clientWidth;H=wrap.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
 fx.width=innerWidth*DPR;fx.height=innerHeight*DPR;fx.style.width=innerWidth+'px';fx.style.height=innerHeight+'px';wr=wrap.getBoundingClientRect();dirty=true;}
function fitView(){fit=Math.min(W/D.w,H/D.h)*.94;sc=fit;ox=(W-D.w*sc)/2;oy=(H-D.h*sc)/2;dirty=true;}
addEventListener('resize',()=>{if(active){resize();fitView();}});
function trail(px,py){for(let k=0;k<2;k++)parts.push({x:wr.left+px,y:wr.top+py,vx:(Math.random()-.5)*1.2,vy:(Math.random()-.5)*1.2,l:1,c:Math.random()<.55?'#fff':COL[L.pal[sel].color],s:1+Math.random()*2.6});}
function paintAt(px,py){const x=(px-ox)/sc,y=(py-oy)/sc,br=9/sc,R=12+br,G=L.gems;
 const x0=Math.max(0,Math.floor((x-R)/HC)),x1=Math.min(hw-1,Math.floor((x+R)/HC)),y0=Math.max(0,Math.floor((y-R)/HC)),y1=Math.min(hh-1,Math.floor((y+R)/HC));let k=0;
 for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++)for(const i of hit[cy*hw+cx]){if(F[i])continue;const g=G[i];if(g[4]!==sel)continue;if(Math.hypot(g[0]-x,g[1]-y)<=g[2]+br)fillGem(i,k++);}}
function fillGem(i,k){const g=L.gems[i],n=g[4];F[i]=1;order.push(i);cnt[n]++;flying.add(i);
 const r=chips[n].getBoundingClientRect();
 fl.push({i,sx:clamp(r.left+r.width/2,0,innerWidth),sy:clamp(r.top+r.height*.38,0,innerHeight),t:0,delay:k*2});
 updChip(n);updProg();saveSoon();dirty=true;
 if(order.length===L.gems.length)setTimeout(finish,1100);
 else if(cnt[n]===tot[n])setTimeout(()=>{if(sel===n)nextNum()},450);}
function landed(i,tx,ty){flying.delete(i);dirty=true;ting();const g=L.gems[i],c=COL[L.pal[g[4]].color],r=g[2]*sc;
 for(let k=0;k<5;k++){const a=Math.random()*7;parts.push({x:tx,y:ty,vx:Math.cos(a)*1.5,vy:Math.sin(a)*1.5,l:1,c:k%2?'#fff':mix(c,'#ffffff',.32),s:1.4+Math.random()*1.5});}
 flash.push({x:tx,y:ty,l:1,r:Math.max(r*1.9,12)});}
function loop(){requestAnimationFrame(loop);if(!active)return;
 if(dirty){dirty=false;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);render(ctx,D,L,{sc,ox,oy,dpr:DPR,vw:W,vh:H,filled:F,sel,skip:flying});}
 fctx.setTransform(1,0,0,1,0,0);fctx.clearRect(0,0,fx.width,fx.height);fctx.setTransform(DPR,0,0,DPR,0,0);
 const bx=wr.left+ox,by=wr.top+oy;
 for(let j=fl.length-1;j>=0;j--){const f=fl[j];if(f.delay>0){f.delay--;continue;}f.t+=.075;const g=L.gems[f.i],pp=L.pal[g[4]],tx=bx+g[0]*sc,ty=by+g[1]*sc;
  if(f.t>=1){fl.splice(j,1);landed(f.i,tx,ty);continue;}
  const e=1-Math.pow(1-f.t,3),r=g[2]*sc,arc=Math.sin(Math.PI*f.t)*Math.max(r*2.4,26),X=f.sx+(tx-f.sx)*e,Y=f.sy+(ty-f.sy)*e-arc,z=r*(1.45-.45*e);
  fctx.save();fctx.globalAlpha=.17*e;fctx.fillStyle='#000';fctx.beginPath();fctx.ellipse(tx,ty+3,r*.6,r*.28,0,0,7);fctx.fill();fctx.restore();
  const a=pp.shape==='round'?0:g[3]*e,m=z/RS*DPR,c=Math.cos(a),sn=Math.sin(a);
  fctx.setTransform(m*c,m*sn,-m*sn,m*c,X*DPR,Y*DPR);fctx.drawImage(sprite(pp.shape,pp.color),-S/2,-S/2);fctx.setTransform(DPR,0,0,DPR,0,0);}
 flash=flash.filter(f=>{f.l-=.05;star(fctx,f.x,f.y,f.r*f.l,'rgba(255,255,255,'+Math.max(f.l,0)+')');return f.l>0});
 if(spark&&order.length&&Math.random()<.28){for(let k=0;k<4;k++){const i=order[(Math.random()*order.length)|0];if(!flying.has(i))twinkle.push({i,l:1});}}
 twinkle=twinkle.filter(w=>{w.l-=.04;const g=L.gems[w.i],x=bx+(g[0]-g[2]*.3)*sc+tilt.x,y=by+(g[1]-g[2]*.3)*sc+tilt.y;
  if(x>-20&&y>-20&&x<innerWidth+20&&y<innerHeight+20)star(fctx,x,y,g[2]*sc*1.16*Math.sin(w.l*Math.PI),'rgba(255,255,255,.94)');return w.l>0});
 parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.038;p.l-=.025;fctx.globalAlpha=Math.max(p.l,0);
  if(p.c==='#fff')star(fctx,p.x,p.y,p.s*2.2,'#fff');else{fctx.fillStyle=p.c;fctx.beginPath();fctx.arc(p.x,p.y,p.s,0,7);fctx.fill();}return p.l>0});
 fctx.globalAlpha=1;}
requestAnimationFrame(loop);

/* ---------- 터치: 한 손가락=칠하기, 두 손가락=확대/이동 ---------- */
const pts=new Map();let pinch=null,painting=false;
wrap.addEventListener('pointerdown',e=>{audioUnlock();wrap.setPointerCapture(e.pointerId);const r=wrap.getBoundingClientRect();wr=r;
 pts.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});
 if(pts.size===2){painting=false;const[a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,sc,ox,oy};}
 else if(pts.size===1){painting=true;const x=e.clientX-r.left,y=e.clientY-r.top;trail(x,y);paintAt(x,y);}});
wrap.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p={x:e.clientX-wr.left,y:e.clientY-wr.top},old=pts.get(e.pointerId);pts.set(e.pointerId,p);
 if(pinch&&pts.size>=2){const[a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
  const ns=clamp(pinch.sc*d/pinch.d,fit*.8,fit*6);ox=mx-(pinch.mx-pinch.ox)*ns/pinch.sc;oy=my-(pinch.my-pinch.oy)*ns/pinch.sc;sc=ns;dirty=true;}
 else if(painting){trail(p.x,p.y);const st=Math.max(1,Math.ceil(Math.hypot(p.x-old.x,p.y-old.y)/6));for(let k=1;k<=st;k++)paintAt(old.x+(p.x-old.x)*k/st,old.y+(p.y-old.y)*k/st);}});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)painting=false;};
wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,ns=clamp(sc*(e.deltaY<0?1.1:.91),fit*.8,fit*6);
 ox=mx-(mx-ox)*ns/sc;oy=my-(my-oy)*ns/sc;sc=ns;dirty=true;},{passive:false});

/* ---------- 버튼 ---------- */
$('bHome').onclick=()=>{active=false;$('game').style.display='none';$('home').style.display='block';fctx.setTransform(1,0,0,1,0,0);fctx.clearRect(0,0,fx.width,fx.height);showHome();};
$('bSpark').onclick=e=>{spark=!spark;e.currentTarget.classList.toggle('on',spark);if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().catch(()=>{});};
$('bSnd').onclick=e=>{snd=!snd;e.currentTarget.classList.toggle('on',snd)};
$('bFind').onclick=()=>{const G=L.gems;let b=-1;for(let i=0;i<G.length;i++)if(!F[i]&&G[i][4]===sel){b=i;break;}
 if(b<0){toast('이 번호는 다 채웠어요');return;}const g=G[b];sc=Math.max(sc,fit*2.5);ox=W/2-g[0]*sc;oy=H/2-g[1]*sc;dirty=true;};
function finalImage(scale){const c=document.createElement('canvas');c.width=D.w*scale;c.height=D.h*scale;render(c.getContext('2d'),D,L,{sc:scale,ox:0,oy:0,dpr:1});return c;}
function finish(){EXP=finalImage(2);$('dImg').src=EXP.toDataURL('image/png');const v=$('dVid');v.style.display='none';v.removeAttribute('src');$('done').style.display='flex';}
function shareFile(b,name,type){const f=new File([b],name,{type});
 if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});
 else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}}
$('bPng').onclick=()=>{EXP.toBlob(b=>shareFile(b,D.id+'.png','image/png'));};
$('bVid').onclick=()=>{const btn=$('bVid');if(btn.dataset.busy)return;
 if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){alert('이 기기에서는 영상 저장이 안 돼요 (iOS 14.5 이상 필요)');return;}
 const Wv=1080,Hv=Math.round(1080*D.h/D.w/2)*2,c=document.createElement('canvas');c.width=Wv;c.height=Hv;const x=c.getContext('2d'),stream=c.captureStream(30);
 const mt=MediaRecorder.isTypeSupported('video/mp4')?'video/mp4':'video/webm',rec=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:6e6}),chunks=[];
 rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 rec.onstop=()=>{const b=new Blob(chunks,{type:mt}),v=$('dVid');v.src=URL.createObjectURL(b);v.style.display='block';btn.textContent='🎬 타임랩스 영상';delete btn.dataset.busy;shareFile(b,'mygems.'+(mt.includes('mp4')?'mp4':'webm'),mt);};
 const s=Wv/D.w,N=order.length,frames=Math.min(300,Math.max(140,N/10|0));let f=0,drawn=0;
 x.fillStyle='#fff';x.fillRect(0,0,Wv,Hv);render(x,D,L,{sc:s,ox:0,oy:0,dpr:1,filled:new Uint8Array(L.gems.length),sel:-1,nonum:true});
 btn.dataset.busy=1;btn.textContent='⏳ 만드는 중…';rec.start();
 const tick=()=>{const to=Math.min(N,Math.ceil(N*(f+1)/frames));for(;drawn<to;drawn++)drawGemAt(x,L.gems[order[drawn]],L.pal,s,0,0,1);x.setTransform(1,0,0,1,0,0);
  f++;if(f<frames+42)setTimeout(tick,33);else rec.stop();};tick();};
$('bClose').onclick=()=>{$('done').style.display='none';$('bHome').onclick();};
$('bReset').onclick=()=>{if(!confirm('처음부터 다시 칠할까요?'))return;localStorage.removeItem('mg5-P-'+D.id);$('done').style.display='none';openDesign(D);};

/* ---------- 갤러리 ---------- */
function showHome(){const list=$('list');list.innerHTML='';
 DESIGNS.forEach(d=>{const card=document.createElement('div');card.className='card';const c=document.createElement('canvas');card.appendChild(c);
  const done=loadProg(d.id).length;card.insertAdjacentHTML('beforeend','<div class="bd">'+d.title+'</div>');list.appendChild(card);
  requestAnimationFrame(()=>{const Ld=getLayout(d),w=card.clientWidth,h=card.clientHeight,s=Math.min(w/d.w,h/d.h);c.width=w*DPR;c.height=h*DPR;
   render(c.getContext('2d'),d,Ld,{sc:s,ox:(w-d.w*s)/2,oy:(h-d.h*s)/2,dpr:DPR});
   if(done)card.insertAdjacentHTML('beforeend','<div class="pct">'+Math.floor(done/Ld.gems.length*100)+'%</div>');});
  card.onclick=()=>openDesign(d);});}
showHome();loadAtlas();
</script></body></html>
