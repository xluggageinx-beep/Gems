<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>My Gems</title>
<style>
:root{--ink:#4a4048;--accent:#e78fb3;--line:#eeeef2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);overflow:hidden;overscroll-behavior:none}
button{touch-action:manipulation;font-family:inherit;color:var(--ink)}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
header{display:flex;gap:6px;padding:8px;overflow-x:auto;flex:0 0 auto}
header button,.sheet button,.chip,.vbtns button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-size:14px;white-space:nowrap}
.on{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important}
#stage{flex:1;position:relative;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#palette{flex:0 0 auto;display:flex;gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));overflow-x:auto;border-top:1px solid var(--line)}
.sw{flex:0 0 auto;width:56px;display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px}
.sw canvas{width:48px;height:48px;border-radius:50%;border:3px solid transparent}
.sw.sel canvas{border-color:var(--accent)}
.sw.done{opacity:.3}
#home{position:fixed;inset:0;background:#fff;z-index:20;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
#home.hide{display:none}
#home h1{font-size:26px;margin:4px 0 2px}
#home h2{font-size:16px;margin:22px 0 10px}
.sub{color:#999;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{aspect-ratio:1;border-radius:18px;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;gap:4px;padding:0;overflow:hidden}
.card b{font-size:44px;line-height:1}
.card img{width:100%;height:100%;object-fit:contain;background:#fff}
.wide{width:100%;border:none;border-radius:18px;padding:16px;font-size:15px;text-align:left;margin-top:8px;background:linear-gradient(135deg,#fff0f6,#f0f4ff)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.empty{grid-column:1/-1;text-align:center;padding:20px 0;color:#aaa;font-size:14px}
#dim{position:fixed;inset:0;background:rgba(0,0,0,.18);display:none;z-index:9}
#dim.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:75%;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.12);transform:translateY(110%);transition:transform .25s;z-index:10}
.sheet.open{transform:none}
.sheet h3{margin:6px 0 10px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cpick{display:flex;flex-direction:column;align-items:center;font-size:11px}
.cpick input{width:40px;height:40px;border:none;background:none;padding:0}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(74,64,72,.9);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:60;white-space:nowrap}
#toast.show{opacity:1}
#viewer{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;align-items:center;z-index:40;padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
#viewer.show{display:flex}
.vtitle{font-size:16px;font-weight:600;padding:6px 0 10px}
.vmedia{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
.vmedia img,.vmedia canvas,.vmedia video{max-width:100%;max-height:62vh;border-radius:12px;border:1px solid var(--line);-webkit-touch-callout:default}
.vmsg{font-size:13px;color:#999;text-align:center;min-height:18px;padding:8px 0}
.vbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.vbtns button:disabled{opacity:.4}
</style>
</head>
<body>
<div id="home">
  <h1>My Gems 💎</h1><div class="sub">오늘은 어떤 보석 그림을 만들까요?</div>
  <div id="cont"></div>
  <h2>보석 크기</h2><div class="chips" id="sizeRow"></div>
  <h2>색 개수</h2><div class="chips" id="kRow"></div>
  <h2>디자인 고르기</h2><div class="cards" id="presets"></div>
  <label class="wide" style="display:block">📷 내 사진으로 만들기<input type="file" accept="image/*" id="file" hidden></label>
  <h2>내 작품</h2><div class="cards" id="works"></div>
</div>

<div id="app">
  <header>
    <button id="bHome">🏠 홈</button>
    <button id="bDeco">🎨 색</button>
    <button id="bTilt">✨ 반짝임</button>
    <button id="bFind">🔎 찾기</button>
    <button id="bFit">⤢ 맞춤</button>
    <button id="bSound">🔊</button>
  </header>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="palette"></div>
</div>

<div id="dim"></div>
<div class="sheet" id="sDeco">
  <h3>색 테마</h3><div class="row" id="themeRow"></div>
  <h3>번호별 색 바꾸기</h3><div class="row" id="pickRow"></div>
</div>

<div id="viewer">
  <div class="vtitle" id="vTitle"></div>
  <div class="vmedia" id="vMedia"></div>
  <div class="vmsg" id="vMsg"></div>
  <div class="vbtns">
    <button id="vImg">🖼 이미지 저장</button>
    <button id="vVid">🎬 타임랩스 만들기</button>
    <button id="vDel">🗑 삭제</button>
    <button id="vClose">닫기</button>
  </div>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d');
const KEY='mygems-v3';
let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,3);
let P=null,filled=null,remain=[],seeds=null,bins=null;
let sel=0,view={s:10,x:0,y:0},sizeOpt=46,colorK=12,soundOn=true;
let light={x:0,y:0},target={x:0,y:0},finger=null;
const pops=new Map(),parts=[];

/* ---------- 도우미 ---------- */
const hexRgb=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const rgbHex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const lum=a=>.299*a[0]+.587*a[1]+.114*a[2];
const shade=(hex,k)=>{const c=hexRgb(hex),t=k>0?255:0,a=Math.abs(k);return rgbHex(c.map(v=>v+(t-v)*a))};
const rgba=(hex,a)=>{const[r,g,b]=hexRgb(hex);return`rgba(${r},${g},${b},${a})`};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mkRng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

const THEMES={
 '원본':null,
 '파스텔 드림':['#fff4f8','#ffd6e5','#f9b4cf','#e7c3f5','#c7b8f5','#b8d4fb','#a8e6df','#c9f0c4','#fff0b3','#ffd3b0'],
 '딥 주얼':['#1a1033','#2b1b5c','#0f3d6b','#0b5a4a','#6b0f2a','#8e1f5a','#b8860b','#1d7a8c','#c2185b','#e0b84f'],
 '로즈골드':['#3d2328','#6e3b42','#a45c62','#c98b84','#e2b4a6','#f0cfc2','#f7e3d9','#fdf3ee','#d4a373','#b5838d'],
 '오션':['#03142b','#0a2f5c','#11528f','#1f78b4','#3fa2d6','#74c5e8','#a8e0f0','#d6f3fa','#2ec4b6','#cbf3f0'],
 '모노 펄':['#2a2a30','#4a4a52','#6c6c75','#90909a','#b4b4bd','#d2d2d9','#e8e8ee','#f8f8fb']
};
const PRESETS=[['🌸','벚꽃'],['🦋','나비'],['🍓','딸기'],['🐱','고양이'],['🌷','튤립'],['🦄','유니콘'],['🍰','케이크'],['🌙','달'],['💖','하트'],['🐳','고래'],['🌻','해바라기'],['🍒','체리'],['🐰','토끼'],['🌈','무지개'],['🍑','복숭아'],['🐠','열대어']];
const CARD_BG=['#fff0f6','#f3efff','#eef7ff','#effaf3','#fff8e8','#fdf0ff'];

/* ---------- 보석 모양 ---------- */
const SH=['round','oval','marquise','pear','heart','cushion','emerald'];
function norm(p){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;p.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
  const cx=(x0+x1)/2,cy=(y0+y1)/2;let m=0;p=p.map(([x,y])=>[x-cx,y-cy]);p.forEach(([x,y])=>m=Math.max(m,Math.hypot(x,y)));return p.map(([x,y])=>[x/m,y/m])}
function outline(s){
  if(s==='emerald')return norm([[-.68,-.72],[.68,-.72],[1,-.44],[1,.44],[.68,.72],[-.68,.72],[-1,.44],[-1,-.44]]);
  const p=[];for(let k=0;k<48;k++){const t=k/48*Math.PI*2,c=Math.cos(t),si=Math.sin(t);let x,y;
    if(s==='round'){x=c;y=si}
    else if(s==='oval'){x=c;y=.74*si}
    else if(s==='marquise'){x=c;y=.5*si*Math.abs(si)}
    else if(s==='pear'){x=c;y=.75*si*Math.sin(t/2)}
    else if(s==='heart'){x=16*si**3;y=-(13*c-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))}
    else{x=Math.sign(c)*Math.abs(c)**.55;y=Math.sign(si)*Math.abs(si)**.55*.92}
    p.push([x,y])}
  return norm(p);
}
const OUT=SH.map(outline);

/* ---------- 보석 스프라이트 (진짜 같은 보석) ---------- */
const LIGHT=-Math.PI*3/4,gemCache=new Map(),slotCache=new Map(),flareCache=new Map();
function pathOf(g,pts){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath()}
function gemSprite(hex,s){const k=hex+s;if(!gemCache.has(k))gemCache.set(k,makeGem(hex,s));return gemCache.get(k)}
function makeGem(hex,s){
  const S=128,C=64,R=52,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
  const pts=OUT[s].map(p=>[C+p[0]*R,C+p[1]*R]);
  const kp=pts.length>16?pts.filter((_,i)=>i%3===0):pts;
  const tp=kp.map(p=>[C+(p[0]-C)*.5,C+(p[1]-C)*.5]);
  const dark=shade(hex,-.55),light=shade(hex,.65);
  g.save();g.shadowColor='rgba(90,60,90,.25)';g.shadowBlur=9;g.shadowOffsetY=4;pathOf(g,pts);g.fillStyle=hex;g.fill();g.restore();
  g.save();pathOf(g,pts);g.clip();
  let gr=g.createRadialGradient(C-R*.3,C-R*.35,2,C,C,R*1.1);
  gr.addColorStop(0,light);gr.addColorStop(.35,hex);gr.addColorStop(.75,shade(hex,-.25));gr.addColorStop(1,shade(hex,-.45));
  g.fillStyle=gr;g.fillRect(0,0,S,S);
  // 크라운 커팅 면
  const n=kp.length;g.lineWidth=.8;
  for(let i=0;i<n;i++){const a=kp[i],b=kp[(i+1)%n],ta=tp[i],tb=tp[(i+1)%n],m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    const d=Math.cos(Math.atan2(m[1]-C,m[0]-C)-LIGHT);
    [[ta,a,m,d],[ta,m,tb,-d*.7+.15],[tb,m,b,d*.6]].forEach(([p1,p2,p3,v])=>{
      pathOf(g,[p1,p2,p3]);g.fillStyle=v>0?`rgba(255,255,255,${.06+.32*v*v})`:rgba(dark,.1+.35*-v);g.fill();
      g.strokeStyle='rgba(255,255,255,.18)';g.stroke()})}
  // 테이블 + 안쪽 반사
  pathOf(g,tp);gr=g.createLinearGradient(C-R*.4,C-R*.4,C+R*.4,C+R*.4);
  gr.addColorStop(0,'rgba(255,255,255,.4)');gr.addColorStop(.5,'rgba(255,255,255,.06)');gr.addColorStop(1,rgba(dark,.25));
  g.fillStyle=gr;g.fill();g.strokeStyle='rgba(255,255,255,.35)';g.stroke();
  for(let i=0;i<n;i++){const a=tp[i],b=tp[(i+1)%n];pathOf(g,[[C,C],a,b]);g.fillStyle=i%2?rgba(dark,.22):'rgba(255,255,255,.1)';g.fill()}
  // 무지갯빛 (불꽃)
  g.globalCompositeOperation='lighter';const rr=mkRng(hex.length*97+s*13+parseInt(hex.slice(1),16));
  for(let j=0;j<4;j++){const x=C+(rr()-.5)*R*1.1,y=C+(rr()-.5)*R*1.1,h=rr()*360;
    gr=g.createRadialGradient(x,y,0,x,y,R*.22);gr.addColorStop(0,`hsla(${h},100%,70%,.35)`);gr.addColorStop(1,`hsla(${h},100%,70%,0)`);g.fillStyle=gr;g.fillRect(0,0,S,S)}
  // 반사광 + 광택
  gr=g.createRadialGradient(C+R*.45,C+R*.5,0,C+R*.45,C+R*.5,R*.5);gr.addColorStop(0,rgba(light,.55));gr.addColorStop(1,rgba(light,0));g.fillStyle=gr;g.fillRect(0,0,S,S);
  g.globalCompositeOperation='source-over';
  gr=g.createRadialGradient(C-R*.35,C-R*.4,0,C-R*.35,C-R*.4,R*.45);gr.addColorStop(0,'rgba(255,255,255,.75)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,S,S);
  gr=g.createRadialGradient(C-R*.3,C-R*.35,0,C-R*.3,C-R*.35,R*.1);gr.addColorStop(0,'#fff');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,S,S);
  g.restore();
  pathOf(g,pts);g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.6;g.stroke();
  return c;
}
function slotSprite(s,on){const k=s+'_'+on;if(slotCache.has(k))return slotCache.get(k);
  const S=128,C=64,R=50,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
  const pts=OUT[s].map(p=>[C+p[0]*R,C+p[1]*R]);
  pathOf(g,pts);g.fillStyle=on?'#ffe2ee':'#f1f1f5';g.fill();
  g.save();pathOf(g,pts);g.clip();g.shadowColor='rgba(0,0,0,.12)';g.shadowBlur=6;g.shadowOffsetY=2;g.lineWidth=6;g.strokeStyle=on?'#ffe2ee':'#f1f1f5';pathOf(g,pts);g.stroke();g.restore();
  pathOf(g,pts);g.strokeStyle=on?'rgba(231,143,179,.6)':'rgba(0,0,0,.05)';g.lineWidth=1.5;g.stroke();
  slotCache.set(k,c);return c}
function flareSprite(hex){if(flareCache.has(hex))return flareCache.get(hex);
  const S=128,C=64,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
  let gr=g.createRadialGradient(C,C,0,C,C,40);gr.addColorStop(0,rgba(shade(hex,.4),.55));gr.addColorStop(1,rgba(hex,0));g.fillStyle=gr;g.fillRect(0,0,S,S);
  const ray=(len,th,al,rot)=>{g.save();g.translate(C,C);g.rotate(rot);gr=g.createLinearGradient(-len,0,len,0);
    gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,`rgba(255,255,255,${al})`);gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr;g.beginPath();g.moveTo(-len,0);g.lineTo(0,-th);g.lineTo(len,0);g.lineTo(0,th);g.closePath();g.fill();g.restore()};
  ray(63,3,1,0);ray(63,3,1,Math.PI/2);ray(32,2,.7,Math.PI/4);ray(32,2,.7,-Math.PI/4);
  gr=g.createRadialGradient(C,C,0,C,C,14);gr.addColorStop(0,'#fff');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,S,S);
  flareCache.set(hex,c);return c}
function put(c,spr,x,y,r,a,k,ox,oy){const m=k*r/52,co=Math.cos(a)*m,si=Math.sin(a)*m;c.setTransform(co,si,-si,co,ox+x*k,oy+y*k);c.drawImage(spr,-64,-64)}

/* ---------- 도안 생성: 다양한 크기·모양 보석 배치 ---------- */
function kmeans(list,k){
  k=Math.min(k,list.length);const sorted=list.slice().sort((a,b)=>lum(a)-lum(b));
  let cent=[];for(let j=0;j<k;j++)cent.push(sorted[Math.floor((j+.5)*sorted.length/k)].slice());
  const asg=new Int16Array(list.length);
  for(let it=0;it<15;it++){const sum=cent.map(()=>[0,0,0,0]);
    list.forEach((p,n)=>{let b=0,bd=1e12;cent.forEach((c,j)=>{const d=(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2;if(d<bd){bd=d;b=j}});
      asg[n]=b;sum[b][0]+=p[0];sum[b][1]+=p[1];sum[b][2]+=p[2];sum[b][3]++});
    cent=cent.map((c,j)=>sum[j][3]?sum[j].slice(0,3).map(v=>v/sum[j][3]):c)}
  const used=[...new Set(asg)].sort((a,b)=>lum(cent[a])-lum(cent[b])),rank={};used.forEach((u,i)=>rank[u]=i);
  return{idx:Array.from(asg,a=>rank[a]),colors:used.map(u=>rgbHex(cent[u]))};
}
function makePattern(src,G,k,seed){
  const Gw=G,Gh=Math.max(4,Math.round(G*src.height/src.width));
  const t=document.createElement('canvas');t.width=Gw;t.height=Gh;const tc=t.getContext('2d');tc.imageSmoothingQuality='high';tc.drawImage(src,0,0,Gw,Gh);
  const d=tc.getImageData(0,0,Gw,Gh).data;
  const op=(x,y)=>{x=Math.floor(x);y=Math.floor(y);return x>=0&&y>=0&&x<Gw&&y<Gh&&d[(y*Gw+x)*4+3]>128};
  const col=(x,y)=>{const i=(Math.floor(y)*Gw+Math.floor(x))*4;return[d[i],d[i+1],d[i+2]]};
  const R=mkRng(seed||Date.now()),gems=[],hash=new Map(),CS=3;
  const free=(x,y,r)=>{const cx=Math.floor(x/CS),cy=Math.floor(y/CS),rg=Math.ceil((r+2.8)/CS);
    for(let i=cx-rg;i<=cx+rg;i++)for(let j=cy-rg;j<=cy+rg;j++){const b=hash.get(i+','+j);if(b)for(const q of b)if(Math.hypot(q.x-x,q.y-y)<(r+q.r)*.9)return false}return true};
  const add=g=>{gems.push(g);const key=Math.floor(g.x/CS)+','+Math.floor(g.y/CS);if(!hash.has(key))hash.set(key,[]);hash.get(key).push(g)};
  const pick=r=>{const w=r<.9?[5,1,0,0,0,3,0]:[3,1.5,1,1.3,1,1.3,1];let s=R()*w.reduce((a,b)=>a+b),i=0;while(s>w[i]){s-=w[i];i++}return i};
  const OFF=[[0,0],[.6,0],[-.6,0],[0,.6],[0,-.6]];
  for(const r of[2.6,1.9,1.4,1,.72]){
    const tries=Math.floor(Gw*Gh/(r*r)*2.5);
    for(let n=0;n<tries;n++){const x=R()*Gw,y=R()*Gh;
      if(!OFF.every(([a,b])=>op(x+a*r,y+b*r)))continue;
      if(r>=1.3){const c0=col(x,y),lim=r>2?1500:2800;if(!OFF.every(([a,b])=>{const c=col(x+a*r,y+b*r);return(c[0]-c0[0])**2+(c[1]-c0[1])**2+(c[2]-c0[2])**2<lim}))continue}
      const rr=r*(.92+R()*.12);if(!free(x,y,rr))continue;
      const s=pick(r);add({x,y,r:rr,s,a:s===0?0:s===4?(R()-.5)*.6:R()*Math.PI*2,c:0})}}
  for(let y=.3;y<Gh;y+=.5)for(let x=.3;x<Gw;x+=.5)if(op(x,y)&&free(x,y,.6))add({x,y,r:.6,s:0,a:0,c:0});

      fl,sz:fl?18+Math.random()*26:2+Math.random()*3.5,hex,col:Math.random()<.5?'#ffffff':`hsl(${Math.random()*360},100%,80%)`,rot:Math.random()*.8})}}

function resize(){const r=$('#stage').getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR}

    if(filled[i]){let sc=1;const pt=pops.get(i);if(pt!==undefined){const u=(t-pt)/260;if(u>=1)pops.delete(i);else sc=1+.5*(1-u)*(1-u)}
      put(ctx,gemSprite(P.colors[g.c],g.s),g.x,g.y,g.r*sc,g.a,k,ox,oy);

    gr.addColorStop(0,'rgba(255,255,255,.7)');gr.addColorStop(.35,rgba(P.colors[sel],.35));gr.addColorStop(1,rgba(P.colors[sel],0));
    ctx.globalAlpha=1;ctx.fillStyle=gr;ctx.beginPath();ctx.arc(finger.x,finger.y,R,0,6.283);ctx.fill()}
  const now=performance.now();
  for(let i=parts.length-1;i>=0;i--){const p=parts[i],el=now-p.t0,u=el/p.life;if(u>=1){parts.splice(i,1);continue}if(u<0)continue;

/* ---------- 칠하기 & 제스처 ---------- */
const local=p=>{const r=cv.getBoundingClientRect();return{x:p.x-r.left,y:p.y-r.top}};
function gemAt(sx,sy){const wx=(sx-view.x)/view.s,wy=(sy-view.y)/view.s,cx=Math.floor(wx/3),cy=Math.floor(wy/3);let best=-1,bd=1e9;
  for(let i=cx-1;i<=cx+1;i++)for(let j=cy-1;j<=cy+1;j++){const b=bins.get(i+','+j);if(b)for(const n of b){const g=P.gems[n];
    if(g.c!==sel||filled[n])continue;const d=Math.hypot(g.x-wx,g.y-wy);if(d<g.r*1.05&&d<bd){bd=d;best=n}}}return best}
function paintAt(sx,sy){const i=gemAt(sx,sy);if(i<0)return;const g=P.gems[i];
  filled[i]=1;remain[sel]--;P.log.push(i);pops.set(i,performance.now());

  if(remain[sel]===0)colorDone()}
function paintLine(a,b){const n=Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/Math.max(2,view.s*.5));for(let k=1;k<=n;k++)paintAt(a.x+(b.x-a.x)*k/n,a.y+(b.y-a.y)*k/n)}

  for(let k=1;k<=P.colors.length;k++){const j=(sel+k)%P.colors.length;if(remain[j]>0){sel=j;break}}setTimeout(renderPalette,400)}
async function onComplete(){

const pts=new Map();let mode=null,last=null,pinch=null,holdT=null;
const pinchInfo=()=>{const[a,b]=[...pts.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,v:{...view}}};
function startPaint(){mode='paint';finger=local(last);paintAt(finger.x,finger.y);spawn(finger.x,finger.y,P.colors[sel],5,.07)}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){mode='wait';last={x:e.clientX,y:e.clientY};holdT=setTimeout(()=>{if(mode==='wait')startPaint()},70)}
  else if(pts.size===2){clearTimeout(holdT);mode='pinch';finger=null;pinch=pinchInfo()}});

  if(mode==='wait'){clearTimeout(holdT);startPaint()}
  if(mode==='paint'){const p={x:e.clientX,y:e.clientY},a=local(last),b=local(p);paintLine(a,b);finger=b;
    spawn(b.x,b.y,P.colors[sel],clamp(Math.round(Math.hypot(b.x-a.x,b.y-a.y)/7),1,5),.05,0,.3);last=p}
  else if(mode==='pinch'&&pts.size===2){const n=pinchInfo(),r=cv.getBoundingClientRect(),fs=Math.min(W/P.W,H/P.H);
    const s=clamp(pinch.v.s*n.d/pinch.d,fs*.5,fs*10),wx=(pinch.cx-r.left-pinch.v.x)/pinch.v.s,wy=(pinch.cy-r.top-pinch.v.y)/pinch.v.s;
    view.s=s;view.x=n.cx-r.left-wx*s;view.y=n.cy-r.top-wy*s}});

  if(pts.size===0){mode=null;finger=null}else if(mode==='pinch')mode='none'}

  const seen=new Uint8Array(w.gems.length),order=[];(w.log||[]).forEach(i=>{if(!seen[i]){seen[i]=1;order.push(i)}});w.gems.forEach((_,i)=>{if(!seen[i])order.push(i)});

    if(el<total)requestAnimationFrame(frame);else{g.drawImage(base,0,0);setTimeout(()=>rec.stop(),200)}}
  requestAnimationFrame(frame)})}

/* ---------- 저장/뷰어 ---------- */
async function shareFile(blob,name){const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove()}
let cur=null,imgBlob=null,vidBlob=null,busy=false;
function setBusy(v){busy=v;['#vImg','#vVid','#vDel','#vClose'].forEach(s=>$(s).disabled=v)}
function openViewer(w,title){closeSheets();cur=w;imgBlob=null;vidBlob=null;
  $('#vTitle').textContent=title||new Date(w.date).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});
  $('#vMsg').textContent='이미지를 준비하는 중…';$('#vVid').textContent='🎬 타임랩스 만들기';$('#vMedia').replaceChildren();$('#viewer').classList.add('show');
  setTimeout(()=>renderWork(w,clamp(Math.floor(2400/Math.max(w.W,w.H)),10,60)).toBlob(b=>{if(cur!==w)return;imgBlob=b;const im=new Image();im.src=URL.createObjectURL(b);
    $('#vMedia').replaceChildren(im);$('#vMsg').textContent=''},'image/png'),30)}
function closeViewer(){if(busy)return;$('#viewer').classList.remove('show');$('#vMedia').replaceChildren();cur=null;if(!$('#home').classList.contains('hide'))renderHome()}
async function makeVideo(){if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){toast('이 기기에선 영상 만들기가 안 돼요');return}
  setBusy(true);const rc=document.createElement('canvas');$('#vMedia').replaceChildren(rc);
  try{vidBlob=await recordTimelapse(cur,rc);const v=document.createElement('video');v.setAttribute('playsinline','');v.muted=v.loop=v.autoplay=v.controls=true;
    v.src=URL.createObjectURL(vidBlob);$('#vMedia').replaceChildren(v);v.play().catch(()=>{});
    $('#vVid').textContent='💾 영상 저장하기';$('#vMsg').textContent="'영상 저장하기' → '비디오 저장'을 누르면 사진 앱에 저장돼요"}
  catch(e){$('#vMsg').textContent='영상을 만들지 못했어요 😢'}setBusy(false)}
$('#vImg').onclick=()=>{if(!imgBlob){toast('잠시만요, 준비 중이에요');return}shareFile(imgBlob,`gems-${cur.id}.png`)};
$('#vVid').onclick=()=>{if(busy)return;if(vidBlob)shareFile(vidBlob,`gems-${cur.id}.${vidBlob.type.includes('mp4')?'mp4':'webm'}`);else makeVideo()};
$('#vDel').onclick=async()=>{if(!cur||!confirm('이 작품을 삭제할까요?'))return;try{await DB.del(cur.id)}catch(e){}closeViewer();toast('삭제했어요')};
$('#vClose').onclick=closeViewer;

/* ---------- 색 시트 ---------- */
function openSheet(id){closeSheets();$('#dim').classList.add('show');$(id).classList.add('open')}
function closeSheets(){$('#dim').classList.remove('show');document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'))}
$('#dim').onclick=closeSheets;
function renderDeco(){
  chipRow($('#themeRow'),Object.keys(THEMES).map(k=>[k,k]),P.theme,applyTheme);
  const pr=$('#pickRow');pr.innerHTML='';
  P.colors.forEach((c,i)=>{const w=document.createElement('label');w.className='cpick';const inp=document.createElement('input');inp.type='color';inp.value=c;
    inp.onchange=()=>{P.colors[i]=inp.value;P.theme='직접';renderPalette();renderDeco();save()};w.append(inp,document.createTextNode(i+1+'번'));pr.append(w)})}
function applyTheme(name){const t=THEMES[name];
  if(!t)P.colors=P.base.slice();
  else{const ts=t.map(hexRgb).sort((a,b)=>lum(a)-lum(b)),n=P.colors.length;
    P.colors=P.colors.map((_,i)=>{const f=n===1?0:i*(ts.length-1)/(n-1),a=Math.floor(f),b=Math.min(ts.length-1,a+1),u=f-a;return rgbHex(ts[a].map((v,k)=>v+(ts[b][k]-v)*u))})}
  P.theme=name;renderPalette();renderDeco();save()}

/* ---------- 버튼 ---------- */
$('#bHome').onclick=showHome;
$('#bDeco').onclick=()=>{renderDeco();openSheet('#sDeco')};
$('#bTilt').onclick=enableTilt;$('#bFit').onclick=fit;
$('#bSound').onclick=()=>{soundOn=!soundOn;$('#bSound').textContent=soundOn?'🔊':'🔇';save()};
$('#bFind').onclick=()=>{const i=P.gems.findIndex((g,k)=>g.c===sel&&!filled[k]);if(i<0){toast('이 색은 다 채웠어요');return}
  const g=P.gems[i],fs=Math.min(W/P.W,H/P.H);view.s=Math.max(view.s,fs*3);view.x=W/2-g.x*view.s;view.y=H/2-g.y*view.s;spawn(W/2,H/2,P.colors[sel],10,.1,0,.5)};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- 시작 ---------- */
window.addEventListener('resize',()=>{resize();fit()});
load();$('#bSound').textContent=soundOn?'🔊':'🔇';resize();showHome();requestAnimationFrame(draw);
</script>
