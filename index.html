<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>My Gems</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#fff;font-family:-apple-system,sans-serif;color:#333;overflow:hidden}
#home{position:fixed;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 40px}
h1{font-family:"Snell Roundhand",cursive;font-size:38px;margin:4px 0 10px;text-align:center;color:#b0789a}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.tab{flex:none;padding:8px 14px;border-radius:20px;background:#f3eef5;font-size:14px}
.tab.on{background:#c98bb0;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:8px}
.card{aspect-ratio:1;border-radius:16px;background:#faf7fb;box-shadow:0 2px 8px #0001;overflow:hidden;position:relative}
.card canvas,.card img{width:100%;height:100%;display:block}
.card .bd{position:absolute;bottom:6px;right:8px;font-size:12px;background:#fffc;border-radius:8px;padding:1px 6px}
#game{position:fixed;inset:0;display:none;flex-direction:column}
#top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px}
#top button,.btn{border:0;background:#f3eef5;border-radius:12px;padding:8px 12px;font-size:14px;color:#333}
#prog{flex:1;text-align:center;font-size:13px;color:#999}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#wrap{flex:1;position:relative;overflow:hidden;touch-action:none;background:#fff}
#cv,#fx{position:absolute;left:0;top:0;transform-origin:0 0}
#fx{pointer-events:none}
#pal{display:flex;gap:8px;overflow-x:auto;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:#fbf9fc}
.pc{flex:none;width:52px;height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;background:#fff;box-shadow:0 1px 4px #0002}
.pc.on{outline:3px solid #c98bb0}.pc.done{opacity:.35}
.pc canvas{width:34px;height:34px}
@media (orientation:landscape) and (min-width:700px){
 #main{flex-direction:row}
 #pal{flex-direction:column;overflow-y:auto;overflow-x:hidden;width:86px;padding:10px}
 .pc{width:64px;height:70px}
}
#done{position:fixed;inset:0;background:#fffe;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9}
#done img{max-width:80vw;max-height:55vh;border-radius:16px;box-shadow:0 4px 20px #0002}
#done video{max-width:80vw;max-height:40vh;display:none}
</style></head><body>

<div id="home">
 <h1>My Gems</h1>
 <div class="tabs" id="tabs"></div>
 <div class="grid" id="list"></div>
</div>

<div id="game">
 <div id="top"><button id="bHome">🏠</button><button id="bFind">찾기</button><div id="prog"></div><button id="bSpark">✨</button><button id="bSnd">🔊</button></div>
 <div id="main"><div id="wrap"><canvas id="cv"></canvas><canvas id="fx"></canvas></div><div id="pal"></div></div>
</div>

<div id="done">
 <div style="font-family:'Snell Roundhand',cursive;font-size:40px;color:#b0789a">Beautiful!</div>
 <img id="dImg"><video id="dVid" playsinline controls></video>
 <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
  <button class="btn" id="bPng">🖼 이미지 저장</button><button class="btn" id="bVid">🎬 타임랩스 영상</button><button class="btn" id="bClose">갤러리로</button>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);
const DPR=Math.min(devicePixelRatio||1,2);
const IPAD=Math.min(screen.width,screen.height)>=700;
const COLS=IPAD?56:44, K=12, CELL=22;
const SHAPES=['round','oval','marquise','pear','heart','cushion','emerald','trillion'];
const KEY='mygems-v4';
const SCRIPT='"Snell Roundhand","Apple Chancery","Savoye LET",cursive';

/* ---------- 도안 정의 ---------- */
function bgGrad(c,a,b){const g=c.createLinearGradient(0,0,512,512);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.fillRect(0,0,512,512)}
function emo(c,e,x,y,s){c.font=s+'px "Apple Color Emoji"';c.textAlign='center';c.textBaseline='middle';c.fillText(e,x,y)}
function pearls(c,r,col,n){for(let i=0;i<n;i++){const a=i/n*Math.PI*2;c.fillStyle=col;c.beginPath();c.arc(256+Math.cos(a)*r,256+Math.sin(a)*r,9,0,7);c.fill()}}
function scatter(c,list,n,seed){let s=seed;const R=()=>(s=(s*9301+49297)%233280)/233280;for(let i=0;i<n;i++){const x=R()*512,y=R()*512;if(Math.hypot(x-256,y-256)<170)continue;emo(c,list[i%list.length],x,y,30+R()*24)}}
function ribbon(c,col){c.fillStyle=col;c.fillRect(0,440,512,40);emo(c,'🎀',256,455,80)}
function text(c,t,y,s,col){c.font=`bold ${s}px ${SCRIPT}`;c.textAlign='center';c.textBaseline='middle';c.lineWidth=10;c.strokeStyle='#fff';c.strokeText(t,256,y);c.fillStyle=col;c.fillText(t,256,y)}

const D={동물:[],악세사리:[],꽃:[],패턴:[],드레스:[],메세지:[]};
['🐱','🐶','🦦','🐨','🦒','🐘','🐰','🐼','🦊','🐻','🐯','🦄','🐧','🐹','🦁','🐮','🐷','🐸'].forEach((e,i)=>D.동물.push({id:'a'+i,icon:e,draw:c=>{bgGrad(c,['#fde2ea','#e3f0ff','#fff4d6','#e6f7ea'][i%4],'#ffffff');scatter(c,['💗','⭐','🌸'],16,i+3);emo(c,e,256,256,330)}}));
const ACC=['💍','📿','👑','💎','⌚','👜','👠','🕶','👛','💄','🎀','👒'];
ACC.forEach((e,i)=>{const th=[['#fde8f0','#f7c9db','#ffffff'],['#1d2a4d','#3c4f8a','#e8d9a8'],['#f6efe3','#e8d2b5','#c9a36b'],['#eae4ff','#c8b8ff','#ffffff']][i%4];
 D.악세사리.push({id:'c'+i,icon:e,draw:c=>{bgGrad(c,th[0],th[1]);pearls(c,215,th[2],36);pearls(c,190,th[2]+'99',30);scatter(c,['✨','⭐','💫'],14,i+7);emo(c,e,256,256,260);if(i%2)ribbon(c,th[1])}})});
const FL=['🌹','🌷','🌸','🌻','🌼','💐','🌺','🪷','🪻'];
FL.forEach((e,i)=>D.꽃.push({id:'f'+i,icon:e,draw:c=>{bgGrad(c,['#fff0f5','#f0fff4','#fffbe8'][i%3],['#ffd6e5','#c9f0d6','#ffe9b0'][i%3]);
 for(let k=0;k<12;k++){const a=k/12*Math.PI*2;emo(c,k%2?'🍃':e,256+Math.cos(a)*200,256+Math.sin(a)*200,60)}scatter(c,['🌸','💮'],10,i+11);emo(c,e,256,256,250)}}));
const PCOL=[['#f7a8c4','#a8d8f7','#fff'],['#2b1b5e','#e0b84c','#7a4fd6'],['#7fd1b9','#f9e07f','#ff8fa3'],['#e5989b','#6d6875','#ffcdb2']];
['만다라','나선','물결','스타버스트','하트'].forEach((n,j)=>PCOL.forEach((p,i)=>D.패턴.push({id:'p'+j+i,label:n,pc:p,draw:c=>{
 c.fillStyle=p[2];c.fillRect(0,0,512,512);c.save();c.translate(256,256);
 if(j==0)for(let r=230;r>10;r-=28){for(let k=0;k<16;k++){c.rotate(Math.PI/8);c.fillStyle=p[(r/28|0)%2];c.beginPath();c.ellipse(r*.6,0,r*.32,r*.1,0,0,7);c.fill()}}
 if(j==1)for(let k=0;k<600;k++){const a=k*.1,r=k*.4;c.fillStyle=p[k%60<30?0:1];c.beginPath();c.arc(Math.cos(a)*r,Math.sin(a)*r,10,0,7);c.fill()}
 if(j==2)for(let y=-260;y<260;y+=36){c.strokeStyle=p[(y/36|0)&1];c.lineWidth=18;c.beginPath();for(let x=-260;x<260;x+=8)c.lineTo(x,y+Math.sin(x/30)*14);c.stroke()}
 if(j==3)for(let k=0;k<24;k++){c.rotate(Math.PI/12);c.fillStyle=p[k%2];c.beginPath();c.moveTo(0,0);c.lineTo(260,-34);c.lineTo(260,34);c.fill()}
 if(j==4)for(let k=0;k<8;k++){c.rotate(Math.PI/4);for(let r=60;r<260;r+=60){c.fillStyle=p[(r/60)%2];c.font=`${r/3+20}px sans-serif`;c.textAlign='center';c.fillText('♥',r,10)}}
 c.restore()}})));
const DRESS=[['#f4a6c0','#fff0f6'],['#8ec5ff','#eef7ff'],['#c9a7ff','#f6f0ff'],['#f6d365','#fffbea'],['#222','#f4f4f4'],['#ff6b6b','#fff1f1']];
DRESS.forEach((d,i)=>[0,1].forEach(t=>D.드레스.push({id:'d'+i+t,icon:'👗',draw:c=>{bgGrad(c,d[1],'#fff');scatter(c,['✨','🌸'],12,i*2+t);
 c.fillStyle=d[0];c.beginPath();c.moveTo(220,110);c.lineTo(292,110);c.lineTo(300,200);
 if(t==0){c.quadraticCurveTo(440,420,430,470);c.lineTo(82,470);c.quadraticCurveTo(72,420,212,200)}else{c.quadraticCurveTo(290,370,380,470);c.lineTo(132,470);c.quadraticCurveTo(222,370,212,200)}
 c.fill();c.fillStyle='#fff8';for(let k=0;k<30;k++){c.beginPath();c.arc(160+Math.random()*190,240+Math.random()*220,4,0,7);c.fill()}
 c.fillStyle=d[0];c.fillRect(225,80,14,40);c.fillRect(273,80,14,40);emo(c,'🎀',256,200,50)}})));
const CARDS=[
 ['Merry','Christmas','#c0392b','#fdf2f2','#e8f5e9',['🎄','🎁','❄️','🔔'],'🎅'],
 ['Merry','Christmas','#1e6b3a','#fff8e8','#fde2e2',['❄️','⭐','🍬'],'🎄'],
 ['Happy','Birthday','#d6336c','#fff0f6','#fff9db',['🎈','🎉','🎊'],'🎂'],
 ['Happy','Birthday','#5f3dc4','#f3f0ff','#e7f5ff',['🎈','🧁','⭐'],'🎁'],
 ['Happy','Anniversary','#a61e4d','#fff0f3','#fff',['🌹','💗','🥂'],'💍'],
 ['Happy','New Year','#b08900','#1b1f3b','#3b4a8a',['🎆','✨','🥂'],'🎇'],
 ['Be My','Valentine','#e03131','#fff5f5','#ffe3e3',['💘','💌','🌹'],'💝'],
 ['Thank','You','#2b8a3e','#f4fce3','#fff',['🌼','🌿','💐'],'🌷'],
 ['Congrat-','ulations','#1971c2','#e7f5ff','#fff',['🎉','🏆','⭐'],'🎓'],
 ['Love','Mom','#c2255c','#fff0f6','#fff',['🌸','💐','💕'],'💐']];
CARDS.forEach((k,i)=>D.메세지.push({id:'m'+i,label:k[0]+' '+k[1],pc:[k[3],k[4],k[2]],draw:c=>{
 bgGrad(c,k[3],k[4]);c.strokeStyle=k[2];c.lineWidth=14;c.strokeRect(22,22,468,468);c.lineWidth=4;c.strokeRect(40,40,432,432);
 for(let x=60;x<512;x+=78){emo(c,k[5][x%3],x,40,40);emo(c,k[5][(x+1)%3],x,472,40)}
 emo(c,k[6],256,135,120);text(c,k[0],270,86,k[2]);text(c,k[1],370,k[1].length>9?68:86,k[2])}}));

/* ---------- 홈 ---------- */
let cat='동물';
function home(){$('game').style.display='none';$('home').style.display='block';
 const tabs=['내 작품',...Object.keys(D)];$('tabs').innerHTML='';
 const st=load();if(st&&!st.done){const b=document.createElement('div');b.className='tab';b.style.background='#ffd8e8';b.textContent='▶ 이어하기';b.onclick=()=>start(null,st);$('tabs').append(b)}
 tabs.forEach(t=>{const b=document.createElement('div');b.className='tab'+(t==cat?' on':'');b.textContent=t;b.onclick=()=>{cat=t;home()};$('tabs').append(b)});
 const L=$('list');L.innerHTML='';
 if(cat=='내 작품'){
  const up=document.createElement('div');up.className='card';up.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;font-size:15px">📷 내 사진</div>';
  const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.style.display='none';
  fi.onchange=()=>{const img=new Image();img.onload=()=>start({id:'photo'+Date.now(),draw:c=>{const s=Math.max(512/img.width,512/img.height);c.drawImage(img,256-img.width*s/2,256-img.height*s/2,img.width*s,img.height*s)}});img.src=URL.createObjectURL(fi.files[0])};
  up.onclick=()=>fi.click();L.append(up,fi);
  galAll(list=>list.reverse().forEach(w=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<img src="${w.img}">`;d.onclick=()=>showDone(w.img,w.order,w.st);L.append(d)}));
  return}
 D[cat].forEach(d=>{const el=document.createElement('div');el.className='card';
  if(d.icon&&cat!='악세사리'&&cat!='꽃'||cat=='드레스')el.innerHTML=`<div style="display:flex;height:100%;align-items:center;justify-content:center;font-size:56px">${d.icon}</div>`;
  else{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.scale(.25,.25);d.draw(x);el.append(c)}
  if(d.label)el.innerHTML+=`<div class="bd">${d.label}</div>`;
  el.onclick=()=>start(d);L.append(el)})}

/* ---------- 도안 → 보석 ---------- */
function build(d){
 const src=document.createElement('canvas');src.width=src.height=512;const sx=src.getContext('2d');sx.fillStyle='#fff';sx.fillRect(0,0,512,512);d.draw(sx);
 const g=document.createElement('canvas');g.width=g.height=COLS;const gx=g.getContext('2d');gx.imageSmoothingQuality='high';gx.drawImage(src,0,0,COLS,COLS);
 const px=gx.getImageData(0,0,COLS,COLS).data,pts=[];
 for(let i=0;i<COLS*COLS;i++)pts.push([px[i*4],px[i*4+1],px[i*4+2]]);
 let cen=[];for(let i=0;i<K;i++)cen.push(pts[(i*pts.length/K+i*37)%pts.length|0].slice());
 const lab=new Array(pts.length);
 for(let it=0;it<12;it++){const s=cen.map(()=>[0,0,0,0]);
  pts.forEach((p,i)=>{let b=0,bd=1e9;cen.forEach((c,j)=>{const dd=(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2;if(dd<bd){bd=dd;b=j}});lab[i]=b;s[b][0]+=p[0];s[b][1]+=p[1];s[b][2]+=p[2];s[b][3]++});
  s.forEach((v,j)=>{if(v[3])cen[j]=[v[0]/v[3],v[1]/v[3],v[2]/v[3]]})}
 const used=[...new Set(lab)].sort((a,b)=>lum(cen[a])-lum(cen[b])),map={};used.forEach((u,i)=>map[u]=i);
 const cols=used.map(u=>'#'+cen[u].map(v=>(v|0).toString(16).padStart(2,'0')).join(''));
 const cells=lab.map(l=>({c:map[l],s:.72+Math.random()*.3,r:(Math.random()-.5)*.5,f:0}));
 const shapes=cols.map((_,i)=>SHAPES[i%SHAPES.length]);
 return{id:d.id,cols,shapes,cells,order:[],done:false}}
function lum(c){return c[0]*.3+c[1]*.59+c[2]*.11}

/* ---------- 보석 스프라이트 ---------- */
const SPR={};
function shapePath(x,sh,R){x.beginPath();
 if(sh=='round')x.arc(0,0,R,0,7);
 else if(sh=='oval')x.ellipse(0,0,R*.75,R,0,0,7);
 else if(sh=='marquise'){x.moveTo(0,-R);x.quadraticCurveTo(R*1.1,0,0,R);x.quadraticCurveTo(-R*1.1,0,0,-R)}
 else if(sh=='pear'){x.moveTo(0,-R);x.quadraticCurveTo(R*.9,R*.1,R*.75,R*.4);x.arc(0,R*.4,R*.75,0,Math.PI);x.quadraticCurveTo(-R*.9,R*.1,0,-R)}
 else if(sh=='heart'){x.moveTo(0,R*.95);x.bezierCurveTo(-R*1.3,0,-R*.7,-R*1.05,0,-R*.4);x.bezierCurveTo(R*.7,-R*1.05,R*1.3,0,0,R*.95)}
 else if(sh=='cushion'){const r=R*.4;x.roundRect(-R*.9,-R*.9,R*1.8,R*1.8,r)}
 else if(sh=='emerald'){const a=R*.7,b=R*.95,k=R*.25;x.moveTo(-a+k,-b);x.lineTo(a-k,-b);x.lineTo(a,-b+k);x.lineTo(a,b-k);x.lineTo(a-k,b);x.lineTo(-a+k,b);x.lineTo(-a,b-k);x.lineTo(-a,-b+k)}
 else{x.moveTo(0,-R);x.quadraticCurveTo(R*.95,R*.5,R*.95,R*.6);x.quadraticCurveTo(0,R*1.05,-R*.95,R*.6);x.quadraticCurveTo(-R*.95,R*.5,0,-R)}
 x.closePath()}
function shade(h,a){let n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,a>0?v+(255-v)*a:v*(1+a)))|0;return`rgb(${f(r)},${f(g)},${f(b)})`}
function sprite(hex,sh){const k=hex+sh;if(SPR[k])return SPR[k];
 const S=128,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.translate(S/2,S/2);const R=S*.42;
 x.save();x.shadowColor='rgba(0,0,0,.28)';x.shadowBlur=8;x.shadowOffsetY=5;shapePath(x,sh,R);x.fillStyle=shade(hex,-.35);x.fill();x.restore();
 x.save();shapePath(x,sh,R);x.clip();
 const g=x.createRadialGradient(-R*.3,-R*.35,R*.1,0,0,R*1.2);g.addColorStop(0,shade(hex,.55));g.addColorStop(.45,hex);g.addColorStop(1,shade(hex,-.5));x.fillStyle=g;x.fillRect(-S,-S,S*2,S*2);
 const n=sh=='emerald'?4:10;
 for(let i=0;i<n;i++){const a=i/n*Math.PI*2,b=(i+1)/n*Math.PI*2;x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(a)*R*1.4,Math.sin(a)*R*1.4);x.lineTo(Math.cos(b)*R*1.4,Math.sin(b)*R*1.4);x.closePath();
  const v=Math.sin(i*2.3+1);x.fillStyle=v>0?`rgba(255,255,255,${v*.28})`:`rgba(0,0,0,${-v*.22})`;x.fill()}
 x.save();x.scale(.5,.5);shapePath(x,sh,R);x.restore();const t=x.createLinearGradient(-R*.5,-R*.5,R*.5,R*.5);t.addColorStop(0,'rgba(255,255,255,.55)');t.addColorStop(.5,shade(hex,.15));t.addColorStop(1,'rgba(255,255,255,.1)');x.fillStyle=t;x.fill();
 const ir=x.createLinearGradient(-R,R,R,-R);['rgba(255,120,200,.12)','rgba(120,200,255,.12)','rgba(255,240,120,.12)'].forEach((s,i)=>ir.addColorStop(i/2,s));x.fillStyle=ir;x.fillRect(-S,-S,S*2,S*2);
 x.restore();
 x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.ellipse(-R*.35,-R*.4,R*.22,R*.1,-.6,0,7);x.fill();
 x.fillStyle='rgba(255,255,255,.6)';x.beginPath();x.arc(R*.35,R*.3,R*.06,0,7);x.fill();
 return SPR[k]=c}
function slot(sh){const k='slot'+sh;if(SPR[k])return SPR[k];const S=128,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.translate(S/2,S/2);
 shapePath(x,sh,S*.4);x.fillStyle='#efecf1';x.fill();x.save();x.clip();x.shadowColor='rgba(0,0,0,.18)';x.shadowBlur=6;x.shadowOffsetY=3;x.lineWidth=8;x.strokeStyle='#fff';shapePath(x,sh,S*.46);x.stroke();x.restore();return SPR[k]=c}

/* ---------- 게임 ---------- */
let st,sel=0,cv=$('cv'),cx=cv.getContext('2d'),fx=$('fx'),fc=fx.getContext('2d'),W,view={s:1,x:0,y:0},drops=[],parts=[],flash=[],snd=true,tilt={x:0,y:0};
function save(){try{localStorage.setItem(KEY,JSON.stringify({...st,cells:st.cells.map(c=>[c.c,+c.s.toFixed(2),+c.r.toFixed(2),c.f])}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s)return null;s.cells=s.cells.map(a=>({c:a[0],s:a[1],r:a[2],f:a[3]}));return s}catch(e){return null}}
function start(d,s){st=s||build(d);$('home').style.display='none';$('game').style.display='flex';sel=firstOpen();save();
 W=COLS*CELL;cv.width=fx.width=W*DPR;cv.height=fx.height=W*DPR;cv.style.width=fx.style.width=cv.style.height=fx.style.height=W+'px';
 cx.setTransform(DPR,0,0,DPR,0,0);fc.setTransform(DPR,0,0,DPR,0,0);fit();redraw();palette()}
function firstOpen(){for(let i=0;i<st.cols.length;i++)if(st.cells.some(c=>c.c==i&&!c.f))return i;return 0}
function fit(){const r=$('wrap').getBoundingClientRect();view.s=Math.min(r.width,r.height)/W*.96;view.x=(r.width-W*view.s)/2;view.y=(r.height-W*view.s)/2;apply()}
function apply(){const t=`translate(${view.x}px,${view.y}px) scale(${view.s})`;cv.style.transform=fx.style.transform=t}
function drawCell(i){const c=st.cells[i],x=(i%COLS)*CELL+CELL/2,y=(i/COLS|0)*CELL+CELL/2;cx.clearRect(x-CELL/2,y-CELL/2,CELL,CELL);
 const sh=st.shapes[c.c],z=CELL*1.05*c.s;cx.save();cx.translate(x,y);cx.rotate(c.r);
 if(c.f==1)cx.drawImage(sprite(st.cols[c.c],sh),-z/2,-z/2,z,z);
 else{cx.drawImage(slot(sh),-z/2,-z/2,z,z);cx.rotate(-c.r);if(view.s*CELL>9||true){cx.fillStyle=c.c==sel?'#c2256c':'#9a95a0';cx.font=`${c.c==sel?'bold ':''}${CELL*.36}px -apple-system`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(c.c+1,0,1)}}
 cx.restore()}
function redraw(){cx.fillStyle='#fff';cx.fillRect(0,0,W,W);st.cells.forEach((_,i)=>drawCell(i));prog()}
function prog(){const n=st.cells.filter(c=>c.f).length;$('prog').textContent=Math.floor(n/st.cells.length*100)+'%'}
function palette(){const P=$('pal');P.innerHTML='';st.cols.forEach((h,i)=>{const left=st.cells.filter(c=>c.c==i&&!c.f).length;
 const b=document.createElement('div');b.className='pc'+(i==sel?' on':'')+(left?'':' done');const c=document.createElement('canvas');c.width=c.height=68;c.getContext('2d').drawImage(sprite(h,st.shapes[i]),0,0,68,68);
 b.append(c);b.append(i+1+'');b.onclick=()=>{sel=i;palette();redraw()};P.append(b)})}

/* 입력 */
const pts={};let pinch=null,lastHit=-1;
const wrap=$('wrap');
function toCell(e){const r=wrap.getBoundingClientRect(),x=(e.clientX-r.left-view.x)/view.s,y=(e.clientY-r.top-view.y)/view.s;
 if(x<0||y<0||x>=W||y>=W)return{i:-1,x,y};return{i:(y/CELL|0)*COLS+(x/CELL|0),x,y}}
wrap.addEventListener('pointerdown',e=>{wrap.setPointerCapture(e.pointerId);pts[e.pointerId]={x:e.clientX,y:e.clientY};
 const k=Object.keys(pts);if(k.length==2){const a=pts[k[0]],b=pts[k[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.s,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,vx:view.x,vy:view.y}}else rub(e)});
wrap.addEventListener('pointermove',e=>{if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};const k=Object.keys(pts);
 if(pinch&&k.length>=2){const a=pts[k[0]],b=pts[k[1]],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2,r=wrap.getBoundingClientRect();
  const ns=Math.max(.3,Math.min(8,pinch.s*d/pinch.d)),ox=(pinch.mx-r.left-pinch.vx)/pinch.s,oy=(pinch.my-r.top-pinch.vy)/pinch.s;
  view.s=ns;view.x=mx-r.left-ox*ns;view.y=my-r.top-oy*ns;apply()}else if(!pinch)rub(e)});
['pointerup','pointercancel'].forEach(t=>wrap.addEventListener(t,e=>{delete pts[e.pointerId];if(Object.keys(pts).length<2)pinch=null;if(!Object.keys(pts).length){pinch=null;lastHit=-1}}));
function rub(e){const h=toCell(e);for(let k=0;k<2;k++)parts.push({x:h.x,y:h.y,vx:(Math.random()-.5)*1.2,vy:(Math.random()-.5)*1.2,l:1,c:Math.random()<.5?'#fff':st.cols[sel],s:1+Math.random()*2.5});
 const r=CELL*.6;[[0,0],[r,0],[-r,0],[0,r],[0,-r]].forEach(([dx,dy])=>{const cx2=h.x+dx,cy2=h.y+dy;if(cx2<0||cy2<0||cx2>=W||cy2>=W)return;const i=(cy2/CELL|0)*COLS+(cx2/CELL|0);fill(i)})}
function fill(i){const c=st.cells[i];if(!c||c.f||c.c!=sel)return;c.f=2;st.order.push(i);drops.push({i,t:0});}
function landed(i){const c=st.cells[i];c.f=1;drawCell(i);ting();const x=(i%COLS)*CELL+CELL/2,y=(i/COLS|0)*CELL+CELL/2;
 for(let k=0;k<5;k++){const a=Math.random()*7;parts.push({x,y,vx:Math.cos(a)*1.6,vy:Math.sin(a)*1.6,l:1,c:k%2?'#fff':shade(st.cols[c.c],.5),s:1.5+Math.random()*1.5})}
 flash.push({x,y,l:1});
 if(!st.cells.some(c=>c.c==sel&&!c.f)){palette()}
 if(st.cells.every(c=>c.f==1))finish();else{prog();clearTimeout(save.t);save.t=setTimeout(save,600)}}

/* 효과 루프 */
function loop(){requestAnimationFrame(loop);if(!st||$('game').style.display=='none')return;fc.clearRect(0,0,W,W);
 drops=drops.filter(d=>{d.t+=.09;const c=st.cells[d.i],x=(d.i%COLS)*CELL+CELL/2,y=(d.i/COLS|0)*CELL+CELL/2;
  if(d.t>=1){landed(d.i);return false}const e=1-(1-d.t)**3,sc=2.6-1.6*e,z=CELL*1.05*c.s*sc;
  fc.save();fc.globalAlpha=.25*e;fc.fillStyle='#000';fc.beginPath();fc.ellipse(x,y+3,z*.3,z*.15,0,0,7);fc.fill();fc.restore();
  fc.save();fc.translate(x,y-(1-e)*CELL*2.2);fc.rotate(c.r);fc.drawImage(sprite(st.cols[c.c],st.shapes[c.c]),-z/2,-z/2,z,z);fc.restore();return true});
 fc.globalCompositeOperation='lighter';
 flash=flash.filter(f=>{f.l-=.06;star(f.x,f.y,CELL*1.2*f.l,`rgba(255,255,255,${f.l})`);return f.l>0});
 if(sparkOn){const t=performance.now()/1000;for(let k=0;k<6;k++){const i=(Math.random()*st.cells.length)|0;if(st.cells[i].f==1)twinkle.push({i,l:1})}}
 twinkle=twinkle.filter(w=>{w.l-=.04;const x=(w.i%COLS)*CELL+CELL*.35,y=(w.i/COLS|0)*CELL+CELL*.35;star(x+tilt.x,y+tilt.y,CELL*.7*Math.sin(w.l*Math.PI),'rgba(255,255,255,.95)');return w.l>0});
 parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.l-=.025;fc.globalAlpha=Math.max(p.l,0);
  if(p.c=='#fff')star(p.x,p.y,p.s*2.2,'#fff');else{fc.fillStyle=p.c;fc.beginPath();fc.arc(p.x,p.y,p.s,0,7);fc.fill()}return p.l>0});
 fc.globalAlpha=1;fc.globalCompositeOperation='source-over'}
let twinkle=[],sparkOn=true;
function star(x,y,r,col){if(r<=0)return;fc.save();fc.translate(x,y);const g=fc.createRadialGradient(0,0,0,0,0,r*.6);g.addColorStop(0,col);g.addColorStop(1,'rgba(255,255,255,0)');fc.fillStyle=g;fc.beginPath();fc.arc(0,0,r*.6,0,7);fc.fill();
 fc.fillStyle=col;fc.beginPath();for(let k=0;k<4;k++){fc.rotate(Math.PI/2);fc.moveTo(0,0);fc.lineTo(r*.12,r*.12);fc.lineTo(0,r);fc.lineTo(-r*.12,r*.12)}fc.fill();fc.restore()}
loop();
addEventListener('deviceorientation',e=>{tilt.x=(e.gamma||0)/15;tilt.y=(e.beta-40||0)/15});

/* 소리 */
let ac;function ting(){if(!snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=1800+Math.random()*900;g.gain.setValueAtTime(.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.25);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.25)}catch(e){}}

/* 버튼 */
$('bHome').onclick=()=>{save();home()};
$('bSnd').onclick=()=>{snd=!snd;$('bSnd').textContent=snd?'🔊':'🔇';if(snd&&window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().catch(()=>{})};
$('bSpark').onclick=()=>{sparkOn=!sparkOn;$('bSpark').style.opacity=sparkOn?1:.4;if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().catch(()=>{})};
$('bFind').onclick=()=>{const i=st.cells.findIndex(c=>c.c==sel&&!c.f);if(i<0)return;const r=wrap.getBoundingClientRect();view.s=Math.max(view.s,2.5);
 view.x=r.width/2-((i%COLS)*CELL+CELL/2)*view.s;view.y=r.height/2-((i/COLS|0)*CELL+CELL/2)*view.s;apply();flash.push({x:(i%COLS)*CELL+CELL/2,y:(i/COLS|0)*CELL+CELL/2,l:1})};
addEventListener('resize',()=>{if(st&&$('game').style.display!='none')setTimeout(fit,200)});

/* 완성/저장 */
function render(n,size){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),s=size/COLS;x.fillStyle='#fff';x.fillRect(0,0,size,size);
 const on=new Set(st.order.slice(0,n));st.cells.forEach((cl,i)=>{if(!on.has(i))return;const z=s*1.05*cl.s;x.save();x.translate((i%COLS)*s+s/2,(i/COLS|0)*s+s/2);x.rotate(cl.r);x.drawImage(sprite(st.cols[cl.c],st.shapes[cl.c]),-z/2,-z/2,z,z);x.restore()});return c}
function finish(){st.done=true;save();const img=render(st.order.length,1600).toDataURL('image/jpeg',.9);galAdd({img,order:st.order,st:{cols:st.cols,shapes:st.shapes,cells:st.cells}});
 for(let k=0;k<200;k++)twinkle.push({i:(Math.random()*st.cells.length)|0,l:1});setTimeout(()=>showDone(img),1500)}
let doneSt=null;
function showDone(img,order,s){if(s)doneSt={...s,order};else doneSt=null;$('dImg').src=img;$('dVid').style.display='none';$('done').style.display='flex'}
$('bClose').onclick=()=>{$('done').style.display='none';localStorage.removeItem(KEY);cat='내 작품';home()};
$('bPng').onclick=async()=>{const b=await (await fetch($('dImg').src)).blob();const f=new File([b],'mygems.jpg',{type:b.type});
 if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=$('dImg').src;a.download='mygems.jpg';a.click()}};
$('bVid').onclick=()=>{const keep=st;if(doneSt)st=doneSt;if(!window.MediaRecorder){alert('이 기기에서는 영상 저장이 안 돼요 (iOS 14.5 이상 필요)');st=keep;return}
 const size=1080,c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),stream=c.captureStream(30);
 const mt=MediaRecorder.isTypeSupported('video/mp4')?'video/mp4':'video/webm',rec=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:6e6}),chunks=[];
 rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{const b=new Blob(chunks,{type:mt}),u=URL.createObjectURL(b);const v=$('dVid');v.src=u;v.style.display='block';
  const f=new File([b],'mygems.'+(mt.includes('mp4')?'mp4':'webm'),{type:mt});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});st=keep};
 const N=st.order.length,frames=Math.min(300,Math.max(150,N/10|0));let f=0;rec.start();$('bVid').textContent='⏳ 만드는 중…';
 const s=size/COLS;x.fillStyle='#fff';x.fillRect(0,0,size,size);let drawn=0;
 const tick=()=>{const to=Math.min(N,Math.ceil(N*(f+1)/frames));for(;drawn<to;drawn++){const i=st.order[drawn],cl=st.cells[i],z=s*1.05*cl.s;x.save();x.translate((i%COLS)*s+s/2,(i/COLS|0)*s+s/2);x.rotate(cl.r);x.drawImage(sprite(st.cols[cl.c],st.shapes[cl.c]),-z/2,-z/2,z,z);x.restore()}
  f++;if(f<frames+45)setTimeout(tick,33);else{rec.stop();$('bVid').textContent='🎬 타임랩스 영상'}};tick()};

/* 갤러리 IndexedDB */
let db;const dbp=new Promise(r=>{const q=indexedDB.open('mygems4',1);q.onupgradeneeded=()=>q.result.createObjectStore('w',{autoIncrement:true});q.onsuccess=()=>{db=q.result;r()}});
function galAdd(w){dbp.then(()=>db.transaction('w','readwrite').objectStore('w').add(w))}
function galAll(cb){dbp.then(()=>{const q=db.transaction('w').objectStore('w').getAll();q.onsuccess=()=>cb(q.result)})}

home();
</script></body></html>
